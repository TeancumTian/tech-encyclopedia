name: Check interactive website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate book, compile website, check learning models
        run: make web-check
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-encyclopedia
          path: build/web
          retention-days: 14
          include-hidden-files: true
