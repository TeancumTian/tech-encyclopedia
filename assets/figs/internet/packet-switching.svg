<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>电路交换与分组交换</title><text x="20.0" y="24.0" font-size="13" fill="#475569" text-anchor="start" font-weight="700">电路交换（电话）：通话期间独占整条线路</text><line x1="40.0" y1="85.0" x2="170.0" y2="50.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="40.0" y1="85.0" x2="170.0" y2="125.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="50.0" x2="330.0" y2="50.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="125.0" x2="330.0" y2="125.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="50.0" x2="330.0" y2="125.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="125.0" x2="330.0" y2="50.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="50.0" x2="460.0" y2="85.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="125.0" x2="460.0" y2="85.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="50.0" x2="170.0" y2="125.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="50.0" x2="330.0" y2="125.0" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><line x1="40.0" y1="85.0" x2="170.0" y2="50.0" stroke="#475569" stroke-width="6" stroke-linecap="round"/><line x1="170.0" y1="50.0" x2="330.0" y2="50.0" stroke="#475569" stroke-width="6" stroke-linecap="round"/><line x1="330.0" y1="50.0" x2="460.0" y2="85.0" stroke="#475569" stroke-width="6" stroke-linecap="round"/><circle cx="40.0" cy="85.0" r="12.0" fill="#475569" stroke="#475569" stroke-width="2"/><text x="40.0" y="89.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">A</text><circle cx="170.0" cy="50.0" r="9.0" fill="#fff" stroke="#475569" stroke-width="2"/><circle cx="170.0" cy="125.0" r="9.0" fill="#fff" stroke="#475569" stroke-width="2"/><circle cx="330.0" cy="50.0" r="9.0" fill="#fff" stroke="#475569" stroke-width="2"/><circle cx="330.0" cy="125.0" r="9.0" fill="#fff" stroke="#475569" stroke-width="2"/><circle cx="460.0" cy="85.0" r="12.0" fill="#475569" stroke="#475569" stroke-width="2"/><text x="460.0" y="89.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="560.0" y="70.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">别人用不了这条线</text><text x="560.0" y="88.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">哪怕你一言不发</text><text x="20.0" y="180.0" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="700">分组交换（互联网）：切成小包，各自寻路，共享线路</text><line x1="40.0" y1="241.0" x2="170.0" y2="206.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="40.0" y1="241.0" x2="170.0" y2="281.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="206.0" x2="330.0" y2="206.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="281.0" x2="330.0" y2="281.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="206.0" x2="330.0" y2="281.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="281.0" x2="330.0" y2="206.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="206.0" x2="460.0" y2="241.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="281.0" x2="460.0" y2="241.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="206.0" x2="170.0" y2="281.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><line x1="330.0" y1="206.0" x2="330.0" y2="281.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><circle cx="40.0" cy="241.0" r="12.0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="40.0" y="245.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">A</text><circle cx="170.0" cy="206.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="170.0" cy="281.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="330.0" cy="206.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="330.0" cy="281.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="460.0" cy="241.0" r="12.0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="460.0" y="245.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">B</text><rect x="96.0" y="214.0" width="18.0" height="16.0" rx="2" fill="#d97706" stroke="#fff" stroke-width="1"/><text x="105.0" y="226.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">1</text><rect x="241.0" y="198.0" width="18.0" height="16.0" rx="2" fill="#d97706" stroke="#fff" stroke-width="1"/><text x="250.0" y="210.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">2</text><rect x="241.0" y="273.0" width="18.0" height="16.0" rx="2" fill="#d97706" stroke="#fff" stroke-width="1"/><text x="250.0" y="285.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">3</text><rect x="386.0" y="252.0" width="18.0" height="16.0" rx="2" fill="#d97706" stroke="#fff" stroke-width="1"/><text x="395.0" y="264.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">4</text><rect x="241.0" y="237.0" width="18.0" height="16.0" rx="2" fill="#db2777" stroke="#fff" stroke-width="1"/><text x="250.0" y="249.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">x</text><rect x="201.0" y="255.5" width="18.0" height="16.0" rx="2" fill="#0f766e" stroke="#fff" stroke-width="1"/><text x="210.0" y="267.5" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">y</text><text x="560.0" y="220.0" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">橙色：A 发给 B 的包</text><text x="560.0" y="238.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">其他颜色：别人的包</text><text x="560.0" y="262.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">到达后按序号重组</text><text x="560.0" y="280.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">某条线断了就绕道</text><text x="340.0" y="312.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">代价：包可能延迟、乱序、丢失 → 交给 TCP 来补救</text></svg>
