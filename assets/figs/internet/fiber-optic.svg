<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>光纤通信</title><text x="240.0" y="26.0" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">全反射：光被“关”在纤芯里</text><rect x="30.0" y="50.0" width="420.0" height="110.0" rx="50" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><rect x="30.0" y="80.0" width="420.0" height="50.0" rx="0" fill="#ecfeff" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="460.0" y="70.0" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700">包层（折射率低）</text><text x="460.0" y="110.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">纤芯（折射率高）</text><text x="460.0" y="126.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">直径约 9 微米</text><path d="M40.0,105.0 L90.0,82.0 L150.0,128.0 L210.0,82.0 L270.0,128.0 L330.0,82.0 L390.0,128.0 L440.0,100.0" stroke="#dc2626" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M440.0,100.0 L435.7,106.7 L432.0,100.2 Z" fill="#dc2626" stroke="none"/><text x="240.0" y="180.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">光以很斜的角度碰到边界时会全部反射回来，几乎不漏</text><text x="340.0" y="214.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">波分复用：多种颜色的光同时走一根光纤</text><line x1="40.0" y1="232.0" x2="150.0" y2="262.0" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/><line x1="530.0" y1="262.0" x2="640.0" y2="232.0" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/><line x1="40.0" y1="242.0" x2="150.0" y2="262.0" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/><line x1="530.0" y1="262.0" x2="640.0" y2="242.0" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/><line x1="40.0" y1="252.0" x2="150.0" y2="262.0" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/><line x1="530.0" y1="262.0" x2="640.0" y2="252.0" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/><line x1="40.0" y1="262.0" x2="150.0" y2="262.0" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/><line x1="530.0" y1="262.0" x2="640.0" y2="262.0" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/><line x1="40.0" y1="272.0" x2="150.0" y2="262.0" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/><line x1="530.0" y1="262.0" x2="640.0" y2="272.0" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/><rect x="150.0" y="252.0" width="380.0" height="20.0" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><line x1="160.0" y1="256.0" x2="520.0" y2="256.0" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/><line x1="160.0" y1="259.0" x2="520.0" y2="259.0" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/><line x1="160.0" y1="262.0" x2="520.0" y2="262.0" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/><line x1="160.0" y1="265.0" x2="520.0" y2="265.0" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round"/><line x1="160.0" y1="268.0" x2="520.0" y2="268.0" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/><text x="95.0" y="292.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">合波</text><text x="585.0" y="292.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">分波</text><text x="340.0" y="292.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">每种颜色一路信号，单根光纤可达每秒数十太比特</text></svg>
