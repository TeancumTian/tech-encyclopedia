="400"></text><text x="562.0" y="110.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">相邻小区用不同频率</text><text x="562.0" y="125.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">（不同颜色）避免干扰</text><text x="562.0" y="140.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400"></text><text x="562.0" y="155.7" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">隔得够远就重复使用</text><text x="562.0" y="170.7" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">同一频率（同色）</text><text x="562.0" y="185.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400"></text><text x="562.0" y="200.6" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">→ 有限的频谱</text><text x="562.0" y="215.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">服务无限多的人</text></svg>
