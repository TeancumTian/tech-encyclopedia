<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>TCP 三次握手与确认重传</title><rect x="80.0" y="14.0" width="120.0" height="34.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="140.0" y="35.1" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">客户端（你的手机）</text><rect x="480.0" y="14.0" width="120.0" height="34.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="540.0" y="35.1" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">服务器</text><line x1="140.0" y1="50.0" x2="140.0" y2="350.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><line x1="540.0" y1="50.0" x2="540.0" y2="350.0" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="140.0" y1="70.0" x2="534.4" y2="83.8" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="butt"/><path d="M540.0,84.0 L532.8,87.5 L533.1,80.0 Z" fill="#7c3aed" stroke="none"/><text x="340.0" y="73.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="400">SYN：能听到吗？</text><line x1="540.0" y1="105.0" x2="145.6" y2="118.8" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="butt"/><path d="M140.0,119.0 L146.9,115.0 L147.2,122.5 Z" fill="#7c3aed" stroke="none"/><text x="340.0" y="108.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="400">SYN-ACK：能，你呢？</text><line x1="140.0" y1="140.0" x2="534.4" y2="153.8" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="butt"/><path d="M540.0,154.0 L532.8,157.5 L533.1,150.0 Z" fill="#7c3aed" stroke="none"/><text x="340.0" y="143.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="400">ACK：能。</text><line x1="140.0" y1="190.0" x2="534.4" y2="203.8" stroke="#d97706" stroke-width="1.8" stroke-linecap="butt"/><path d="M540.0,204.0 L532.8,207.5 L533.1,200.0 Z" fill="#d97706" stroke="none"/><text x="340.0" y="193.0" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="400">数据段 1</text><line x1="540.0" y1="225.0" x2="145.6" y2="238.8" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/><path d="M140.0,239.0 L146.9,235.0 L147.2,242.5 Z" fill="#475569" stroke="none"/><text x="340.0" y="228.0" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="400">ACK 1：收到 1</text><line x1="140.0" y1="260.0" x2="534.4" y2="273.8" stroke="#d97706" stroke-width="1.8" stroke-linecap="butt"/><path d="M540.0,274.0 L532.8,277.5 L533.1,270.0 Z" fill="#d97706" stroke="none"/><text x="340.0" y="263.0" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="400">数据段 2</text><line x1="140.0" y1="325.0" x2="534.4" y2="338.8" stroke="#d97706" stroke-width="1.8" stroke-linecap="butt"/><path d="M540.0,339.0 L532.8,342.5 L533.1,335.0 Z" fill="#d97706" stroke="none"/><text x="340.0" y="328.0" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="400">数据段 2（重发）</text><rect x="390.0" y="264.0" width="152.0" height="14.0" rx="0" fill="#fff" stroke="none" stroke-width="1.2"/><line x1="540.0" y1="262.0" x2="540.0" y2="278.0" stroke="#059669" stroke-width="2" stroke-linecap="round"/><text x="392.0" y="272.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">✕ 丢失</text><path d="M140,260 L340,267" stroke="#dc2626" stroke-width="0" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="10.0" y="66.0" width="120.0" height="90.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="70.0" y="96.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">三次握手</text><text x="70.0" y="111.6" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">建立连接</text><rect x="10.0" y="256.0" width="120.0" height="76.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="70.0" y="280.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">超时没收到</text><text x="70.0" y="294.3" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">ACK 2</text><text x="70.0" y="308.6" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">→ 重发</text><rect x="550.0" y="170.0" width="125.0" height="110.0" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/><text x="612.0" y="194.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">IP：只管寄</text><text x="612.0" y="208.3" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">（尽力而为）</text><text x="612.0" y="222.6" font-size="11" fill="#111827" text-anchor="middle" font-weight="400"></text><text x="612.0" y="236.9" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">TCP：编号、确认、</text><text x="612.0" y="251.2" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">重发、排序</text></svg>
