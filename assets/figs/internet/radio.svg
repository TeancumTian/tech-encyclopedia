<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="Noto Sans CJK SC, sans-serif"><title>无线电通信</title><rect x="20.0" y="100.0" width="110.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="75.0" y="134.4" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">声音 / 数据</text><line x1="132.0" y1="130.0" x2="154.4" y2="130.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M160.0,130.0 L152.9,133.8 L152.9,126.2 Z" fill="#111827" stroke="none"/><rect x="162.0" y="100.0" width="110.0" height="60.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="217.0" y="128.3" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">发射机</text><text x="217.0" y="141.7" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">调制到载波上</text><line x1="290.0" y1="130.0" x2="290.0" y2="50.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><path d="M278.0,50.0 L290.0,30.0 L302.0,50.0" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="272.0" y1="130.0" x2="290.0" y2="130.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/><text x="290.0" y="22.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="400"></text><path d="M315.0,42.0 A30,30 0 0 1 315.0,78.0" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M415.0,42.0 A30,30 0 0 0 415.0,78.0" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M328.0,26.4 A56,56 0 0 1 328.0,93.6" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M402.0,26.4 A56,56 0 0 0 402.0,93.6" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M341.0,10.800000000000004 A82,82 0 0 1 341.0,109.19999999999999" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M389.0,10.800000000000004 A82,82 0 0 0 389.0,109.19999999999999" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M354.0,-4.799999999999997 A108,108 0 0 1 354.0,124.8" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M376.0,-4.799999999999997 A108,108 0 0 0 376.0,124.8" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><text x="365.0" y="150.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="700">电磁波以光速传播</text><line x1="440.0" y1="130.0" x2="440.0" y2="50.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><path d="M428.0,50.0 L440.0,30.0 L452.0,50.0" stroke="#111827" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="440.0" y1="130.0" x2="458.0" y2="130.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/><rect x="458.0" y="100.0" width="100.0" height="60.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="508.0" y="128.3" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">接收机</text><text x="508.0" y="141.7" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">调谐 → 解调</text><line x1="560.0" y1="130.0" x2="578.4" y2="130.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M584.0,130.0 L576.9,133.8 L576.9,126.2 Z" fill="#111827" stroke="none"/><rect x="586.0" y="100.0" width="80.0" height="60.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="626.0" y="134.4" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">还原</text><rect x="40.0" y="190.0" width="600.0" height="70.0" rx="10" fill="#fff" stroke="#475569" stroke-width="1.2"/><text x="340.0" y="212.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">天线里来回振荡的电流 → 向四周辐射电磁波；电磁波扫过接收天线 → 感应出微弱电流</text><text x="340.0" y="234.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">不同电台用不同频率（载波）；调谐 = 只挑出你想听的那个频率</text><text x="340.0" y="252.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">频率越高，能携带的信息越多，但越容易被遮挡</text></svg>
