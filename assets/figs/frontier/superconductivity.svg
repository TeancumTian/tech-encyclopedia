<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" font-family="Noto Sans CJK SC, sans-serif"><title>超导的两个标志</title><line x1="50.0" y1="170.0" x2="250.0" y2="170.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="50.0" y1="170.0" x2="50.0" y2="50.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><path d="M50.0,168.0 L120.0,168.0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M120.0,168.0 L120.0,110.0 L120.0,110.0 L125.0,108.2 L130.0,106.5 L135.0,104.8 L140.0,103.0 L145.0,101.2 L150.0,99.5 L155.0,97.8 L160.0,96.0 L165.0,94.2 L170.0,92.5 L175.0,90.8 L180.0,89.0 L185.0,87.2 L190.0,85.5 L195.0,83.8 L200.0,82.0 L205.0,80.2 L210.0,78.5 L215.0,76.8 L220.0,75.0 L225.0,73.2 L230.0,71.5 L235.0,69.8 L240.0,68.0 L245.0,66.2" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="120.0" y1="170.0" x2="120.0" y2="60.0" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/><text x="120.0" y="184.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">临界温度</text><text x="250.0" y="184.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400">温度 →</text><text x="44.0" y="58.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400">电阻</text><text x="80.0" y="158.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">精确为零</text><text x="150.0" y="24.0" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">① 电阻突然消失</text><text x="390.0" y="24.0" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="700">② 迈斯纳效应：排出磁场</text><rect x="320.0" y="130.0" width="140.0" height="30.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="390.0" y="150.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">超导体（冷却中）</text><rect x="365.0" y="66.0" width="50.0" height="22.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="390.0" y="82.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">磁铁</text><path d="M370.0,88 Q314.0,126 262.0,145.0" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M380.0,88 Q352.0,126 316.0,145.0" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M400.0,88 Q428.0,126 464.0,145.0" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M410.0,88 Q466.0,126 518.0,145.0" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><text x="390.0" y="186.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="400">磁感线绕开超导体，磁铁被稳稳托起</text><text x="260.0" y="212.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">原因：电子结成“库珀对”，凝聚成同一个量子态，不再被晶格散射</text></svg>
