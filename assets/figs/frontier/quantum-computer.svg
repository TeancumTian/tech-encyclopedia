<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>比特与量子比特</title><text x="110.0" y="28.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">经典比特</text><rect x="40.0" y="46.0" width="60.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="70.0" y="78.1" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">0</text><text x="110.0" y="76.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">或</text><rect x="120.0" y="46.0" width="60.0" height="50.0" rx="6" fill="#475569" stroke="#475569" stroke-width="1.2"/><text x="150.0" y="78.1" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="110.0" y="116.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">任一时刻只取一个值</text><text x="340.0" y="28.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">量子比特（布洛赫球）</text><circle cx="340.0" cy="108.0" r="56.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><path d="M284,108 A56,16.8 0 0 0 396,108" stroke="#7c3aed" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3,3"/><path d="M284,108 A56,16.8 0 0 1 396,108" stroke="#7c3aed" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="340.0" y="46.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">|0⟩</text><text x="340.0" y="180.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">|1⟩</text><line x1="340.0" y1="108.0" x2="371.6" y2="81.5" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/><path d="M376.5,77.4 L373.1,85.7 L367.7,79.3 Z" fill="#dc2626" stroke="none"/><circle cx="340.0" cy="108.0" r="3.0" fill="#111827" stroke="none" stroke-width="0"/><text x="384.5" y="73.4" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">α|0⟩ + β|1⟩</text><text x="570.0" y="180.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">球面上任意一点都是合法状态</text><rect x="470.0" y="46.0" width="200.0" height="112.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="570.0" y="68.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">测量时</text><text x="484.0" y="94.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">以 |α|² 的概率得到 0</text><text x="484.0" y="116.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">以 |β|² 的概率得到 1</text><text x="484.0" y="140.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">测完叠加就消失了</text><line x1="20.0" y1="196.0" x2="660.0" y2="196.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><text x="180.0" y="222.0" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">n 个量子比特 → 2ⁿ 个概率幅</text><text x="60.0" y="248.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">10 个比特</text><line x1="130.0" y1="244.0" x2="161.8" y2="244.0" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="butt"/><path d="M166.0,244.0 L160.7,246.8 L160.7,241.2 Z" fill="#1d4ed8" stroke="none"/><text x="176.0" y="248.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">1024 个数</text><text x="60.0" y="274.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">50 个比特</text><line x1="130.0" y1="270.0" x2="161.8" y2="270.0" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="butt"/><path d="M166.0,270.0 L160.7,272.8 L160.7,267.2 Z" fill="#1d4ed8" stroke="none"/><text x="176.0" y="274.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">约 10¹⁵ 个数</text><text x="60.0" y="300.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">300 个比特</text><line x1="130.0" y1="296.0" x2="161.8" y2="296.0" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="butt"/><path d="M166.0,296.0 L160.7,298.8 L160.7,293.2 Z" fill="#1d4ed8" stroke="none"/><text x="176.0" y="300.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">比宇宙中的原子还多</text><text x="180.0" y="340.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">经典计算机光是存下它们就不可能</text><text x="510.0" y="222.0" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">算法：让答案通过干涉“脱颖而出”</text><rect x="380.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="530.0" y="314.4" width="10.0" height="5.6" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="394.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="544.0" y="315.8" width="10.0" height="4.2" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="408.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="558.0" y="313.0" width="10.0" height="7.0" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="422.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="572.0" y="255.6" width="10.0" height="64.4" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/><rect x="436.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="586.0" y="315.1" width="10.0" height="4.9" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="450.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="600.0" y="316.5" width="10.0" height="3.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="464.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="614.0" y="313.7" width="10.0" height="6.3" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="478.0" y="295.5" width="10.0" height="24.5" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><rect x="628.0" y="315.8" width="10.0" height="4.2" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="0.8"/><line x1="376.0" y1="320.0" x2="496.0" y2="320.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><line x1="526.0" y1="320.0" x2="646.0" y2="320.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><line x1="500.0" y1="290.0" x2="517.1" y2="290.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M522.0,290.0 L515.8,293.3 L515.8,286.7 Z" fill="#111827" stroke="none"/><text x="436.0" y="336.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">开始：均匀叠加</text><text x="586.0" y="336.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="400">结束：正确答案最可能</text><text x="511.0" y="280.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">干涉</text></svg>
