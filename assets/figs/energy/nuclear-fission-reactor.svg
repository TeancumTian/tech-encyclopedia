97706" stroke-width="1.6"/><text x="150.0" y="290.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">每次裂变放出 2–3 个中子</text><text x="150.0" y="308.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">若都引发新裂变 → 指数增长</text><text x="420.0" y="24.0" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">反应堆：把增长控制在“恰好 1”</text><rect x="320.0" y="40.0" width="200.0" height="240.0" rx="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="420.0" y="296.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="400">压力容器（水既是慢化剂也是冷却剂）</text><rect x="350.0" y="110.0" width="14.0" height="140.0" rx="3" fill="#d97706" stroke="none" stroke-width="1.2"/><rect x="395.0" y="110.0" width="14.0" height="140.0" rx="3" fill="#d97706" stroke="none" stroke-width="1.2"/><rect x="440.0" y="110.0" width="14.0" height="140.0" rx="3" fill="#d97706" stroke="none" stroke-width="1.2"/><rect x="485.0" y="110.0" width="14.0" height="140.0" rx="3" fill="#d97706" stroke="none" stroke-width="1.2"/><text x="420.0" y="268.0" font-size="10.5" fill="#d97706" text-anchor="middle" font-weight="700">燃料棒</text><rect x="372.0" y="30.0" width="10.0" height="150.0" rx="2" fill="#111827" stroke="none" stroke-width="1.2"/><rect x="417.0" y="30.0" width="10.0" height="150.0" rx="2" fill="#111827" stroke="none" stroke-width="1.2"/><rect x="462.0" y="30.0" width="10.0" height="150.0" rx="2" fill="#111827" stroke="none" stroke-width="1.2"/><text x="420.0" y="100.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="400"></text><line x1="540.0" y1="140.0" x2="540.0" y2="75.6" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M540.0,70.0 L543.8,77.1 L536.2,77.1 Z" fill="#111827" stroke="none"/><text x="548.0" y="104.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">控制棒：</text><text x="548.0" y="120.0" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400">插入吸中子 → 减速</text><text x="548.0" y="136.0" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400">抽出 → 加速</text><line x1="522.0" y1="230.0" x2="594.4" y2="230.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/><path d="M600.0,230.0 L592.9,233.8 L592.9,226.2 Z" fill="#dc2626" stroke="none"/><text x="562.0" y="220.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">热水</text><rect x="602.0" y="200.0" width="70.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="637.0" y="226.9" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">蒸汽</text><text x="637.0" y="241.3" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">发电机</text><text x="640.0" y="176.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="400"></text></svg>
