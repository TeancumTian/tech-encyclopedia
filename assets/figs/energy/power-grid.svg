<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>电网</title><rect x="20.0" y="90.0" width="130.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="85.0" y="123.1" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">发电厂</text><text x="85.0" y="137.6" font-size="10.92" fill="#6b7280" text-anchor="middle" font-weight="400">约 20 千伏</text><rect x="175.0" y="90.0" width="120.0" height="70.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="235.0" y="123.3" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">升压变电站</text><text x="235.0" y="136.7" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">升到 220–1000 千伏</text><rect x="485.0" y="90.0" width="120.0" height="70.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="545.0" y="123.3" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">降压变电站</text><text x="545.0" y="136.7" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">降到 10 千伏</text><path d="M330.0,160.0 L344.0,80.0 L358.0,160.0" stroke="#475569" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="334.0" y1="100.0" x2="354.0" y2="100.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/><path d="M385.0,160.0 L399.0,80.0 L413.0,160.0" stroke="#475569" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="389.0" y1="100.0" x2="409.0" y2="100.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/><path d="M440.0,160.0 L454.0,80.0 L468.0,160.0" stroke="#475569" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="444.0" y1="100.0" x2="464.0" y2="100.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/><path d="M318,100 Q360,118 389,100 Q417,118 444,100 Q470,118 482,104" stroke="#dc2626" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="400.0" y="72.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">高压输电线（远距离）</text><line x1="152.0" y1="125.0" x2="167.4" y2="125.0" stroke="#111827" stroke-width="2" stroke-linecap="butt"/><path d="M173.0,125.0 L165.9,128.8 L165.9,121.2 Z" fill="#111827" stroke="none"/><line x1="297.0" y1="125.0" x2="312.4" y2="125.0" stroke="#111827" stroke-width="2" stroke-linecap="butt"/><path d="M318.0,125.0 L310.9,128.8 L310.9,121.2 Z" fill="#111827" stroke="none"/><line x1="605.0" y1="125.0" x2="619.4" y2="125.0" stroke="#111827" stroke-width="2" stroke-linecap="butt"/><path d="M625.0,125.0 L617.9,128.8 L617.9,121.2 Z" fill="#111827" stroke="none"/><text x="650.0" y="110.0" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="700">工厂</text><text x="650.0" y="125.0" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="700">家庭</text><text x="650.0" y="139.9" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="700">220 伏</text><rect x="40.0" y="200.0" width="600.0" height="82.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.2"/><text x="340.0" y="224.0" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">为什么要升高电压？功率 P = 电压 U × 电流 I，线路损耗 = I² × R</text><text x="340.0" y="248.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">电压提高 10 倍 → 同样功率下电流降到 1/10 → 损耗降到 1/100</text><text x="340.0" y="270.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">电网每一秒都必须让发电 = 用电，否则频率偏离 50 赫兹</text></svg>
