<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Noto Sans CJK SC, sans-serif"><title>抽水蓄能</title><path d="M10,70 L120,70 L170,220 L510,220" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="15.0" y="50.0" width="100.0" height="22.0" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="65.0" y="42.0" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">上水库</text><rect x="330.0" y="196.0" width="170.0" height="24.0" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="415.0" y="188.0" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">下水库</text><path d="M110,72 L300,200" stroke="#1d4ed8" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="270.0" y="150.0" width="90.0" height="40.0" rx="6" fill="#475569" stroke="#475569" stroke-width="1.2"/><text x="315.0" y="174.1" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">水泵水轮机</text><line x1="230.0" y1="110.0" x2="179.8" y2="78.9" stroke="#d97706" stroke-width="2.4" stroke-linecap="butt"/><path d="M175.0,76.0 L183.0,76.5 L179.0,82.9 Z" fill="#d97706" stroke="none"/><text x="250.0" y="100.0" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">电多（白天光伏）</text><text x="250.0" y="114.3" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">→ 抽水上山</text><line x1="200.0" y1="130.0" x2="250.3" y2="162.0" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="butt"/><path d="M255.0,165.0 L247.0,164.4 L251.1,158.0 Z" fill="#1d4ed8" stroke="none"/><text x="130.0" y="160.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">电少（晚高峰）</text><text x="130.0" y="174.3" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">→ 放水发电</text><text x="260.0" y="244.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">往返效率约 70–80%；全球装机约 2 亿千瓦，是最大的储能方式</text></svg>
