<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>蒸气压缩制冷循环</title><rect x="250.0" y="30.0" width="180.0" height="56.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="340.0" y="56.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">冷凝器（放热）</text><text x="340.0" y="70.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">高压气体 → 液体，热散到室外</text><rect x="250.0" y="234.0" width="180.0" height="56.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="340.0" y="260.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">蒸发器（吸热）</text><text x="340.0" y="274.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">低压液体 → 气体，从冰箱内吸热</text><rect x="520.0" y="132.0" width="130.0" height="56.0" rx="6" fill="#475569" stroke="#475569" stroke-width="1.2"/><text x="585.0" y="158.1" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">压缩机</text><text x="585.0" y="172.6" font-size="10.92" fill="#fff" text-anchor="middle" font-weight="400">耗电做功</text><rect x="30.0" y="132.0" width="130.0" height="56.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="95.0" y="158.1" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">膨胀阀</text><text x="95.0" y="172.6" font-size="10.92" fill="#6b7280" text-anchor="middle" font-weight="400">降压降温</text><line x1="585.0" y1="130.0" x2="437.1" y2="62.3" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/><path d="M432.0,60.0 L440.0,59.5 L436.9,66.4 Z" fill="#dc2626" stroke="none"/><text x="544.5" y="89.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="400">高温高压气</text><line x1="248.0" y1="60.0" x2="101.1" y2="127.7" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/><path d="M96.0,130.0 L100.8,123.6 L104.0,130.5 Z" fill="#dc2626" stroke="none"/><text x="142.0" y="89.0" font-size=