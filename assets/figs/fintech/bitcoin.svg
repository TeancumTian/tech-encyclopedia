<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>挖矿与减半</title><text x="20.0" y="28.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">① 挖矿：反复试随机数（nonce）</text><rect x="20.0" y="44.0" width="150.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="95.0" y="77.3" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">区块头</text><text x="95.0" y="90.7" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">前一块哈希 + 交易 + nonce</text><line x1="170.0" y1="79.0" x2="214.4" y2="79.0" stroke="#111827" stroke-width="1.8" stroke-linecap="butt"/><path d="M220.0,79.0 L212.9,82.8 L212.9,75.2 Z" fill="#111827" stroke="none"/><rect x="222.0" y="54.0" width="90.0" height="50.0" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><text x="267.0" y="83.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">SHA-256</text><line x1="312.0" y1="79.0" x2="344.4" y2="79.0" stroke="#111827" stroke-width="1.8" stroke-linecap="butt"/><path d="M350.0,79.0 L342.9,82.8 L342.9,75.2 Z" fill="#111827" stroke="none"/><text x="356.0" y="50.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">nonce = 1</text><text x="470.0" y="50.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">8f3a91…</text><text x="580.0" y="50.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">✗</text><text x="356.0" y="70.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">nonce = 2</text><text x="470.0" y="70.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">c71e04…</text><text x="580.0" y="70.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">✗</text><text x="356.0" y="90.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">…试了上万亿次…</text><text x="356.0" y="110.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">nonce = 7350…</text><text x="470.0" y="110.0" font-size="11" fill="#059669" text-anchor="start" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">000000004b…</text><text x="580.0" y="110.0" font-size="11" fill="#059669" text-anchor="start" font-weight="700">✓ 小于目标</text><text x="340.0" y="144.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">找答案：只能盲猜，平均约 10 分钟全网才找到一个　验证：别人只需算一次</text><text x="20.0" y="184.0" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="700">② 区块奖励大约每四年减半，总量趋近 2100 万枚</text><line x1="70.0" y1="330.0" x2="490.0" y2="330.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="70.0" y1="330.0" x2="70.0" y2="204.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><rect x="80.0" y="210.0" width="56.0" height="120.0" rx="1" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="108.0" y="205.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">50</text><text x="108.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2009</text><rect x="150.0" y="270.0" width="56.0" height="60.0" rx="1" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="178.0" y="265.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">25</text><text x="178.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2012</text><rect x="220.0" y="300.0" width="56.0" height="30.0" rx="1" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="248.0" y="295.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">12.5</text><text x="248.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2016</text><rect x="290.0" y="315.0" width="56.0" height="15.0" rx="1" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="318.0" y="310.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">6.25</text><text x="318.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2020</text><rect x="360.0" y="322.5" width="56.0" height="7.5" rx="1" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="388.0" y="317.5" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">3.125</text><text x="388.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">2024</text><text x="62.0" y="210.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400">枚/块</text><rect x="510.0" y="200.0" width="160.0" height="130.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="590.0" y="222.0" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">为什么矿工守规矩？</text><text x="522.0" y="246.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">诚实挖矿：拿奖励</text><text x="522.0" y="266.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">篡改账本：需过半算力</text><text x="522.0" y="286.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">成本远高于收益</text><text x="522.0" y="306.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">不如老老实实挖</text></svg>
