<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>钢筋混凝土梁</title><rect x="40.0" y="90.0" width="380.0" height="60.0" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/><path d="M50.0,150.0 L36.0,176.0 L64.0,176.0 Z" stroke="#475569" stroke-width="1.4" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><path d="M410.0,150.0 L396.0,176.0 L424.0,176.0 Z" stroke="#475569" stroke-width="1.4" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><line x1="230.0" y1="30.0" x2="230.0" y2="78.3" stroke="#111827" stroke-width="2.4" stroke-linecap="butt"/><path d="M230.0,86.0 L224.8,76.3 L235.2,76.3 Z" fill="#111827" stroke="none"/><text x="238.0" y="40.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">荷载</text><text x="48.0" y="108.0" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">上部：受压</text><line x1="128.0" y1="104.0" x2="141.8" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M146.0,104.0 L140.7,106.8 L140.7,101.2 Z" fill="#1d4ed8" stroke="none"/><line x1="172.0" y1="104.0" x2="158.2" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M154.0,104.0 L159.3,101.2 L159.3,106.8 Z" fill="#1d4ed8" stroke="none"/><line x1="198.0" y1="104.0" x2="211.8" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M216.0,104.0 L210.7,106.8 L210.7,101.2 Z" fill="#1d4ed8" stroke="none"/><line x1="242.0" y1="104.0" x2="228.2" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M224.0,104.0 L229.3,101.2 L229.3,106.8 Z" fill="#1d4ed8" stroke="none"/><line x1="268.0" y1="104.0" x2="281.8" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M286.0,104.0 L280.7,106.8 L280.7,101.2 Z" fill="#1d4ed8" stroke="none"/><line x1="312.0" y1="104.0" x2="298.2" y2="104.0" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M294.0,104.0 L299.3,101.2 L299.3,106.8 Z" fill="#1d4ed8" stroke="none"/><text x="412.0" y="108.0" font-size="11" fill="#1d4ed8" text-anchor="end" font-weight="400">混凝土负责</text><line x1="46.0" y1="138.0" x2="414.0" y2="138.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><line x1="46.0" y1="143.0" x2="414.0" y2="143.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="48.0" y="128.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">下部：受拉</text><line x1="146.0" y1="124.0" x2="130.2" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M126.0,124.0 L131.3,121.2 L131.3,126.8 Z" fill="#dc2626" stroke="none"/><line x1="154.0" y1="124.0" x2="169.8" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M174.0,124.0 L168.7,126.8 L168.7,121.2 Z" fill="#dc2626" stroke="none"/><line x1="216.0" y1="124.0" x2="200.2" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M196.0,124.0 L201.3,121.2 L201.3,126.8 Z" fill="#dc2626" stroke="none"/><line x1="224.0" y1="124.0" x2="239.8" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M244.0,124.0 L238.7,126.8 L238.7,121.2 Z" fill="#dc2626" stroke="none"/><line x1="286.0" y1="124.0" x2="270.2" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M266.0,124.0 L271.3,121.2 L271.3,126.8 Z" fill="#dc2626" stroke="none"/><line x1="294.0" y1="124.0" x2="309.8" y2="124.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M314.0,124.0 L308.7,126.8 L308.7,121.2 Z" fill="#dc2626" stroke="none"/><text x="412.0" y="128.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="400">钢筋负责</text><text x="230.0" y="210.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">如果没有钢筋：底部一受拉就开裂</text><rect x="120.0" y="222.0" width="220.0" height="34.0" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/><path d="M230,256 L226,246 L234,238 L229,229" stroke="#dc2626" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="274.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">混凝土抗拉强度只有抗压的约 1/10</text><rect x="450.0" y="30.0" width="220.0" height="236.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="560.0" y="54.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">两者能“合作”的三个条件</text><text x="466.0" y="84.0" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700">① 热膨胀几乎一样</text><text x="466.0" y="104.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">冷热变化时不互相撕裂</text><text x="466.0" y="144.0" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700">② 黏结牢固</text><text x="466.0" y="164.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">螺纹钢让混凝土“咬”住钢筋</text><text x="466.0" y="204.0" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700">③ 碱性保护</text><text x="466.0" y="224.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">混凝土包裹，钢筋不易生锈</text><text x="340.0" y="294.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">抗压交给混凝土、抗拉交给钢筋：各取所长，成本又低</text></svg>
