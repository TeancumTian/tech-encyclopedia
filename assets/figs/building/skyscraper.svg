 x2="210.0" y2="328.0" stroke="#cbd5e1" stroke-width="0.7" stroke-linecap="round"/><rect x="110.0" y="125.0" width="100.0" height="10.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="110.0" y="225.0" width="100.0" height="10.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="216.0" y="134.0" font-size="10.5" fill="#7c3aed" text-anchor="start" font-weight="400">伸臂桁架</text><line x1="160.0" y1="46.0" x2="160.0" y2="66.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><circle cx="160.0" cy="72.0" r="8.0" fill="#d97706" stroke="#111827" stroke-width="1.2"/><text x="216.0" y="70.0" font-size="10.5" fill="#d97706" text-anchor="start" font-weight="400">阻尼器（反向摆动）</text><line x1="34.0" y1="70.0" x2="98.4" y2="70.0" stroke="#0f766e" stroke-width="2" stroke-linecap="butt"/><path d="M104.0,70.0 L96.9,73.8 L96.9,66.2 Z" fill="#0f766e" stroke="none"/><line x1="42.0" y1="120.0" x2="98.4" y2="120.0" stroke="#0f766e" stroke-width="2" stroke-linecap="butt"/><path d="M104.0,120.0 L96.9,123.8 L96.9,116.2 Z" fill="#0f766e" stroke="none"/><line x1="50.0" y1="170.0" x2="98.4" y2="170.0" stroke="#0f766e" stroke-width="2" stroke-linecap="butt"/><path d="M104.0,170.0 L96.9,173.8 L96.9,166.2 Z" fill="#0f766e" stroke="none"/><line x1="58.0" y1="220.0" x2="98.4" y2="220.0" stroke="#0f766e" stroke-width="2" stroke-linecap="butt"/><path d="M104.0,220.0 L96.9,223.8 L96.9,216.2 Z" fill="#0f766e" stroke="none"/><line x1="66.0" y1="270.0" x2="98.4" y2="270.0" stroke="#0f766e" stroke-width="2" stroke-linecap="butt"/><path d="M104.0,270.0 L96.9,273.8 L96.9,266.2 Z" fill="#0f766e" stroke="none"/><text x="28.0" y="56.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">风：越高越强</text><line x1="240.0" y1="90.0" x2="240.0" y2="115.1" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M240.0,120.0 L236.7,113.8 L243.3,113.8 Z" fill="#dc2626" stroke="none"/><line x1="240.0" y1="170.0" x2="240.0" y2="200.4" stroke="#dc2626" stroke-width="2.4000000000000004" stroke-linecap="butt"/><path d="M240.0,206.0 L236.2,198.9 L243.8,198.9 Z" fill="#dc2626" stroke="none"/><line x1="240.0" y1="250.0" x2="240.0" y2="285.7" stroke="#dc2626" stroke-width="3.2" stroke-linecap="butt"/><path d="M240.0,292.0 L235.8,284.1 L244.2,284.1 Z" fill="#dc2626" stroke="none"/><text x="250.0" y="300.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">重力向下累加</text><text x="360.0" y="40.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">超高层要同时解决三件事</text><rect x="360.0" y="62.0" width="70.0" height="46.0" rx="6" fill="#475569" stroke="#475569" stroke-width="1.2"/><text x="395.0" y="89.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">承重</text><text x="442.0" y="90.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">核心筒 + 外框把重量传到深基础</text><rect x="360.0" y="124.0" width="70.0" height="46.0" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><text x="395.0" y="151.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">抗风</text><text x="442.0" y="152.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">外形收进、扭转、开槽；顶部阻尼器减晃</text><rect x="360.0" y="186.0" width="70.0" height="46.0" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><text x="395.0" y="213.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">上下楼</text><text x="442.0" y="214.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">高速电梯、分区转乘、避难层与防火分区</text><rect x="360.0" y="256.0" width="300.0" height="66.0" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/><text x="510.0" y="278.0" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="700">为什么风比重力难？</text><text x="510.0" y="298.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">风推倒楼的力矩 ≈ 风力 × 高度</text><text x="510.0" y="314.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">高度翻倍，力矩约增长 4 倍以上</text></svg>
