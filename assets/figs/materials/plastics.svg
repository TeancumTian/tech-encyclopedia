<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>常见塑料与塑料垃圾的去向</title><text x="340.0" y="24.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">塑料标识码：说明“是什么塑料”，不代表一定能回收</text><path d="M60.0,44.0 L38.0,82.0 L82.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="60.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">1</text><text x="60.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">PET</text><text x="60.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">饮料瓶 · 涤纶</text><path d="M152.0,44.0 L130.0,82.0 L174.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="152.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">2</text><text x="152.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">HDPE</text><text x="152.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">奶瓶 · 管道</text><path d="M244.0,44.0 L222.0,82.0 L266.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="244.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">3</text><text x="244.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">PVC</text><text x="244.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">水管 · 地板</text><path d="M336.0,44.0 L314.0,82.0 L358.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="336.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">4</text><text x="336.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">LDPE</text><text x="336.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">薄膜 · 塑料袋</text><path d="M428.0,44.0 L406.0,82.0 L450.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="428.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">5</text><text x="428.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">PP</text><text x="428.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">餐盒 · 保险杠</text><path d="M520.0,44.0 L498.0,82.0 L542.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="520.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">6</text><text x="520.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">PS</text><text x="520.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">泡沫 · 一次性杯</text><path d="M612.0,44.0 L590.0,82.0 L634.0,82.0 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="612.0" y="76.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">7</text><text x="612.0" y="102.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">其他</text><text x="612.0" y="120.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">PC · 尼龙 · 混合</text><line x1="20.0" y1="146.0" x2="660.0" y2="146.0" stroke="#e5e7eb" stroke-width="1.4" stroke-linecap="round"/><text x="340.0" y="176.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">全球塑料垃圾最终去了哪里（2019 年，经合组织估算）</text><rect x="30.0" y="196.0" width="55.8" height="44.0" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="57.9" y="223.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">9%</text><text x="57.9" y="258.0" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="700">回收</text><rect x="85.8" y="196.0" width="117.8" height="44.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="144.7" y="223.0" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">19%</text><text x="144.7" y="258.0" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="700">焚烧</text><rect x="203.6" y="196.0" width="310.0" height="44.0" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="358.6" y="223.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">50%</text><text x="358.6" y="258.0" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">卫生填埋</text><rect x="513.6" y="196.0" width="136.4" height="44.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="581.8" y="223.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">22%</text><text x="581.8" y="258.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">管理不当 / 泄漏到环境</text><text x="340.0" y="290.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">“管理不当”指露天堆放、露天焚烧或流入河流海洋。</text><text x="340.0" y="304.3" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">回收的塑料还有相当一部分因杂质多而被降级使用或再次丢弃。</text><text x="340.0" y="340.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">2024 年全球塑料产量约 4.3 亿吨（欧洲塑料协会）</text></svg>
