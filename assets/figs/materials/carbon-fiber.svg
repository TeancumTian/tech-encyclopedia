<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Noto Sans CJK SC, sans-serif"><title>比强度对比</title><text x="260.0" y="22.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">比强度 = 强度 ÷ 密度（越长越“轻而强”，数量级示意）</text><text x="122.0" y="61.0" font-size="11.5" fill="#111827" text-anchor="end" font-weight="400">高强度钢</text><rect x="130.0" y="48.0" width="22.5" height="20.0" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="158.5" y="62.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">≈190</text><text x="122.0" y="97.0" font-size="11.5" fill="#111827" text-anchor="end" font-weight="400">铝合金</text><rect x="130.0" y="84.0" width="23.7" height="20.0" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="159.7" y="98.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">≈200</text><text x="122.0" y="133.0" font-size="11.5" fill="#111827" text-anchor="end" font-weight="400">钛合金</text><rect x="130.0" y="120.0" width="25.5" height="20.0" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="161.5" y="134.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">≈215</text><text x="122.0" y="169.0" font-size="11.5" fill="#111827" text-anchor="end" font-weight="700">碳纤维复合材料</text><rect x="130.0" y="156.0" width="130.4" height="20.0" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="266.4" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">≈1100</text><text x="122.0" y="205.0" font-size="11.5" fill="#111827" text-anchor="end" font-weight="700">碳纤维（单丝）</text><rect x="130.0" y="192.0" width="320.0" height="20.0" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="456.0" y="206.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">≈2700</text><text x="260.0" y="236.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">单位：kN·m/kg。复合材料只在纤维方向上最强</text></svg>
