<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>钢：碳含量与炼钢路线</title><text x="340.0" y="24.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">同样是铁，碳含量差一点，“性格”完全不同</text><rect x="60.0" y="70.0" width="8.0" height="34.0" rx="0" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><rect x="62.6" y="70.0" width="268.1" height="34.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="196.6" y="92.0" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">钢</text><rect x="330.7" y="70.0" width="309.3" height="34.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="485.3" y="92.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">铸铁 / 生铁</text><line x1="60.0" y1="104.0" x2="60.0" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="60.0" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">0%</text><line x1="124.4" y1="104.0" x2="124.4" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="124.4" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">0.5%</text><line x1="188.9" y1="104.0" x2="188.9" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="188.9" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1%</text><line x1="253.3" y1="104.0" x2="253.3" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="253.3" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1.5%</text><line x1="317.8" y1="104.0" x2="317.8" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="317.8" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">2%</text><line x1="382.2" y1="104.0" x2="382.2" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="382.2" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">2.5%</text><line x1="446.7" y1="104.0" x2="446.7" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="446.7" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">3%</text><line x1="511.1" y1="104.0" x2="511.1" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="511.1" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">3.5%</text><line x1="575.6" y1="104.0" x2="575.6" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="575.6" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4%</text><line x1="640.0" y1="104.0" x2="640.0" y2="109.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="640.0" y="122.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4.5%</text><text x="340.0" y="140.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">含碳量（质量百分比）</text><text x="60.0" y="140.0" font-size="10" fill="#475569" text-anchor="start" font-weight="400">← 最左一窄条：纯铁（&lt;0.02%）</text><text x="62.0" y="46.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">低碳钢：软、韧、好焊</text><text x="62.0" y="61.0" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">钢筋 · 车身 · 钢板</text><text x="234.0" y="46.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">高碳钢：硬</text><text x="234.0" y="61.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">刀具 · 弹簧 · 钢轨</text><text x="485.3" y="46.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">铸铁：硬而脆</text><text x="485.3" y="61.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">井盖 · 机床床身</text><text x="20.0" y="180.0" font-size="13.5" fill="#1d4ed8" text-anchor="start" font-weight="700">两条主要炼钢路线（2025 年全球产量占比）</text><rect x="20.0" y="196.0" width="110.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="75.0" y="222.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">铁矿石 + 焦炭</text><line x1="132.0" y1="218.0" x2="154.4" y2="218.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M160.0,218.0 L152.9,221.8 L152.9,214.2 Z" fill="#111827" stroke="none"/><rect x="162.0" y="196.0" width="90.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="207.0" y="216.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">高炉</text><text x="207.0" y="230.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">还原出铁水</text><line x1="254.0" y1="218.0" x2="276.4" y2="218.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M282.0,218.0 L274.9,221.8 L274.9,214.2 Z" fill="#111827" stroke="none"/><rect x="284.0" y="196.0" width="110.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="339.0" y="216.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">转炉吹氧</text><text x="339.0" y="230.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">烧掉多余的碳</text><text x="339.0" y="256.0" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">约 69%</text><rect x="20.0" y="276.0" width="110.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="75.0" y="302.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">废钢</text><line x1="132.0" y1="298.0" x2="276.4" y2="298.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M282.0,298.0 L274.9,301.8 L274.9,294.2 Z" fill="#111827" stroke="none"/><rect x="284.0" y="276.0" width="110.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="339.0" y="296.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">电弧炉</text><text x="339.0" y="310.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">用电熔化</text><text x="339.0" y="336.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">约 30%</text><line x1="396.0" y1="218.0" x2="435.5" y2="246.7" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M440.0,250.0 L432.1,248.9 L436.5,242.8 Z" fill="#111827" stroke="none"/><line x1="396.0" y1="298.0" x2="435.4" y2="271.2" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M440.0,268.0 L436.3,275.1 L432.0,268.9 Z" fill="#111827" stroke="none"/><rect x="442.0" y="236.0" width="90.0" height="46.0" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><text x="487.0" y="257.2" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">钢水</text><text x="487.0" y="271.2" font-size="10.530000000000001" fill="#fff" text-anchor="middle" font-weight="400">调成分</text><line x1="534.0" y1="259.0" x2="550.4" y2="259.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M556.0,259.0 L548.9,262.8 L548.9,255.2 Z" fill="#111827" stroke="none"/><rect x="558.0" y="230.0" width="104.0" height="58.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="610.0" y="251.2" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">连铸 · 轧制</text><text x="610.0" y="264.2" font-size="9.75" fill="#6b7280" text-anchor="middle" font-weight="400">钢板 · 钢筋</text><text x="610.0" y="276.4" font-size="9.75" fill="#6b7280" text-anchor="middle" font-weight="400">型钢 · 钢管</text></svg>
