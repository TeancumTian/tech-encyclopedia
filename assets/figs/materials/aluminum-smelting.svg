<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" font-family="Noto Sans CJK SC, sans-serif"><title>电解铝的电解槽</title><rect x="70.0" y="70.0" width="380.0" height="150.0" rx="4" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="73.0" y="100.0" width="374.0" height="92.0" rx="0" fill="#fef3c7" stroke="none" stroke-width="1.2"/><text x="260.0" y="182.0" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="700">熔融冰晶石 + 溶解的 Al₂O₃（约 960°C）</text><rect x="73.0" y="192.0" width="374.0" height="25.0" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1.2"/><text x="260.0" y="209.0" font-size="11.5" fill="#334155" text-anchor="middle" font-weight="700">液态铝（沉在槽底）</text><rect x="70.0" y="217.0" width="380.0" height="12.0" rx="0" fill="#1f2937" stroke="none" stroke-width="1.2"/><text x="460.0" y="228.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">阴极（−）</text><rect x="130.0" y="50.0" width="60.0" height="90.0" rx="2" fill="#374151" stroke="#111827" stroke-width="1.2"/><line x1="160.0" y1="30.0" x2="160.0" y2="50.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/><circle cx="148.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><circle cx="172.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><rect x="230.0" y="50.0" width="60.0" height="90.0" rx="2" fill="#374151" stroke="#111827" stroke-width="1.2"/><line x1="260.0" y1="30.0" x2="260.0" y2="50.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/><circle cx="248.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><circle cx="272.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><rect x="330.0" y="50.0" width="60.0" height="90.0" rx="2" fill="#374151" stroke="#111827" stroke-width="1.2"/><line x1="360.0" y1="30.0" x2="360.0" y2="50.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/><circle cx="348.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><circle cx="372.0" cy="150.0" r="4.0" fill="#fff" stroke="#475569" stroke-width="0.8"/><text x="260.0" y="22.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">碳阳极（+）：氧在这里与碳结合成 CO₂ 逸出</text><text x="260.0" y="256.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">总反应：2Al₂O₃ + 3C → 4Al + 3CO₂　（每吨铝耗电约 1.3 万—1.5 万度）</text><line x1="40.0" y1="60.0" x2="40.0" y2="214.4" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/><path d="M40.0,220.0 L36.2,212.9 L43.8,212.9 Z" fill="#dc2626" stroke="none"/><text x="34.0" y="140.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">电流</text></svg>
