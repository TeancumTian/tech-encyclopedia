or="middle" font-weight="400">长链：一条链常有几千到几十万个单体</text><line x1="20.0" y1="116.0" x2="660.0" y2="116.0" stroke="#e5e7eb" stroke-width="1.4" stroke-linecap="round"/><text x="20.0" y="140.0" font-size="13.5" fill="#1d4ed8" text-anchor="start" font-weight="700">② 链怎么排，决定材料的“性格”</text><rect x="20.0" y="152.0" width="200.0" height="124.0" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.2"/><text x="120.0" y="296.0" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">直链、排列规整</text><text x="120.0" y="314.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">硬、结晶度高：高密度聚乙烯、纤维</text><rect x="240.0" y="152.0" width="200.0" height="124.0" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.2"/><text x="340.0" y="296.0" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="700">带支链、排不整齐</text><text x="340.0" y="314.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">软、透明：低密度聚乙烯薄膜</text><rect x="460.0" y="152.0" width="200.0" height="124.0" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.2"/><text x="560.0" y="296.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">链与链之间交联成网</text><text x="560.0" y="314.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">热固性塑料 · 硫化橡胶</text><path d="M36.0,166.0 L57.0,174.0 L78.0,166.0 L99.0,174.0 L120.0,166.0 L141.0,174.0 L162.0,166.0 L183.0,174.0 L204.0,166.0" stroke="#1d4ed8" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0,188.0 L57.0,196.0 L78.0,188.0 L99.0,196.0 L120.0,188.0 L141.0,196.0 L162.0,188.0 L183.0,196.0 L204.0,188.0" stroke="#1d4ed8" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0,210.0 L57.0,218.0 L78.0,210.0 L99.0,218.0 L120.0,210.0 L141.0,218.0 L162.0,210.0 L183.0,218.0 L204.0,210.0" stroke="#1d4ed8" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0,232.0 L57.0,240.0 L78.0,23