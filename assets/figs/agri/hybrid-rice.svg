<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Noto Sans CJK SC, sans-serif"><title>三系杂交水稻</title><rect x="20.0" y="30.0" width="130.0" height="58.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="85.0" y="50.5" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">不育系 A</text><text x="85.0" y="64.3" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">花粉不育</text><text x="85.0" y="77.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">只能当母本</text><rect x="20.0" y="150.0" width="130.0" height="58.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="85.0" y="177.1" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">不育系 A</text><text x="85.0" y="190.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">（同上）</text><rect x="200.0" y="30.0" width="120.0" height="58.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="260.0" y="57.1" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">保持系 B</text><text x="260.0" y="70.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">授粉后代仍不育</text><rect x="200.0" y="150.0" width="120.0" height="58.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="260.0" y="177.1" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">恢复系 R</text><text x="260.0" y="190.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">授粉后代可育</text><text x="175.0" y="64.0" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">×</text><text x="175.0" y="184.0" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">×</text><line x1="322.0" y1="59.0" x2="362.4" y2="59.0" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="butt"/><path d="M368.0,59.0 L360.9,62.8 L360.9,55.2 Z" fill="#1d4ed8" stroke="none"/><line x1="322.0" y1="179.0" x2="362.4" y2="179.0" stroke="#059669" stroke-width="1.8" stroke-linecap="butt"/><path d="M368.0,179.0 L360.9,182.8 L360.9,175.2 Z" fill="#059669" stroke="none"/><rect x="372.0" y="30.0" width="130.0" height="58.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="437.0" y="56.9" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">新的不育系 A</text><text x="437.0" y="70.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">用来繁殖母本</text><rect x="372.0" y="150.0" width="130.0" height="58.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="437.0" y="177.1" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">杂交种 F1</text><text x="437.0" y="190.9" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="400">种到大田，增产约两成</text><text x="260.0" y="120.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">关键：找到雄性不育的母本，水稻才能大批量杂交制种</text><text x="260.0" y="238.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">杂种优势只在第一代最强，所以每年都要重新制种</text></svg>
