<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>氮从空气到餐桌</title><rect x="20.0" y="40.0" width="120.0" height="64.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="80.0" y="63.3" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">空气中的氮气 N₂</text><text x="80.0" y="77.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">约占空气 78%</text><text x="80.0" y="90.1" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">植物不能直接用</text><rect x="20.0" y="130.0" width="120.0" height="54.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="80.0" y="154.9" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">天然气 / 煤</text><text x="80.0" y="168.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">提供氢 H₂</text><rect x="190.0" y="60.0" width="150.0" height="110.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="265.0" y="86.0" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">合成氨工厂</text><text x="265.0" y="108.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">N₂ + 3H₂ → 2NH₃</text><text x="265.0" y="123.8" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">高温高压 + 铁催化剂</text><text x="265.0" y="139.5" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">（哈伯—博施法，1913）</text><line x1="142.0" y1="72.0" x2="183.0" y2="93.4" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M188.0,96.0 L180.0,96.1 L183.5,89.4 Z" fill="#475569" stroke="none"/><line x1="142.0" y1="157.0" x2="182.9" y2="138.3" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M188.0,136.0 L183.1,142.4 L180.0,135.5 Z" fill="#475569" stroke="none"/><rect x="380.0" y="80.0" width="110.0" height="70.0" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><text x="435.0" y="106.7" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">氮肥</text><text x="435.0" y="120.6" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="400">尿素 · 硝酸铵</text><text x="435.0" y="133.7" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="400">铵盐</text><line x1="342.0" y1="115.0" x2="372.4" y2="115.0" stroke="#d97706" stroke-width="2" stroke-linecap="butt"/><path d="M378.0,115.0 L370.9,118.8 L370.9,111.2 Z" fill="#d97706" stroke="none"/><rect x="530.0" y="40.0" width="130.0" height="150.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="595.0" y="64.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">农田</text><text x="595.0" y="90.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">根系吸收铵和硝酸盐</text><text x="595.0" y="105.8" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">→ 合成蛋白质</text><text x="595.0" y="121.5" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">→ 籽粒增产</text><line x1="492.0" y1="115.0" x2="522.4" y2="115.0" stroke="#d97706" stroke-width="2" stroke-linecap="butt"/><path d="M528.0,115.0 L520.9,118.8 L520.9,111.2 Z" fill="#d97706" stroke="none"/><rect x="530.0" y="222.0" width="130.0" height="62.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="595.0" y="250.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">进入作物：约四到五成</text><text x="595.0" y="263.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">→ 粮食 · 饲料 → 人</text><line x1="595.0" y1="192.0" x2="595.0" y2="214.4" stroke="#059669" stroke-width="2" stroke-linecap="butt"/><path d="M595.0,220.0 L591.2,212.9 L598.8,212.9 Z" fill="#059669" stroke="none"/><rect x="250.0" y="222.0" width="250.0" height="62.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="375.0" y="244.1" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">流失：其余部分</text><text x="375.0" y="257.7" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">淋溶入河湖（富营养化）· 挥发成氨</text><text x="375.0" y="270.8" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">变成氧化亚氮（强温室气体）</text><line x1="540.0" y1="180.0" x2="505.1" y2="231.4" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt" stroke-dasharray="5,3"/><path d="M502.0,236.0 L502.9,228.0 L509.1,232.3 Z" fill="#dc2626" stroke="none"/><text x="20.0" y="244.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">全球平均：施入的氮</text><text x="20.0" y="262.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">只有不到一半进了粮食</text><text x="20.0" y="282.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">（各地差异很大）</text><text x="340.0" y="312.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">把惰性的 N≡N 三键拆开要很多能量：合成氨消耗了全球约 1–2% 的能源</text></svg>
