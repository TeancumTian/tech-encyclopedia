<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 940" font-family="Noto Sans CJK SC, sans-serif"><title>农业与食品 知识地图</title><text x="340.0" y="30.0" font-size="21" fill="#111827" text-anchor="middle" font-weight="700">农业与食品 · 知识地图</text><text x="340.0" y="52.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">从上往下读：先有阳光、水和氮，再靠机器和良种把它们变成粮食，最后经加工和冷链送上餐桌。</text><rect x="168.0" y="80.0" width="344.0" height="132.8" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="180.0" y="100.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">投入：阳光 · 水 · 氮</text><rect x="180.0" y="110.0" width="56.0" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="208.0" y="123.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">光合作用</text><rect x="242.0" y="110.0" width="89.0" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="286.5" y="123.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">化肥（氮磷钾）</text><rect x="337.0" y="110.0" width="45.0" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="359.5" y="123.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">合成氨</text><rect x="388.0" y="110.0" width="95.6" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="435.8" y="123.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">现代灌溉 · 滴灌</text><rect x="180.0" y="134.0" width="56.0" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="208.0" y="147.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">轮作固氮</text><rect x="242.0" y="134.0" width="67.0" height="19.0" rx="9" fill="#fff" stroke="#d97706" stroke-width="0.8"/><text x="275.5" y="147.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">保护性耕作</text><rect x="168.0" y="226.8" width="344.0" height="132.8" rx="8" fill="#f1f5f9" stroke="#