<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Noto Sans CJK SC, sans-serif"><title>多级火箭</title><rect x="54.0" y="130.0" width="32.0" height="70.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><rect x="56.0" y="86.0" width="28.0" height="44.0" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><rect x="58.0" y="58.0" width="24.0" height="28.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M60,58 L70,40 L80,58 Z" stroke="#059669" stroke-width="1.4" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="70.0" y="222.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">起飞</text><text x="70.0" y="238.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">推动全部质量</text><rect x="186.0" y="156.0" width="28.0" height="44.0" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><rect x="188.0" y="128.0" width="24.0" height="28.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M190,128 L200,110 L210,128 Z" stroke="#059669" stroke-width="1.4" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="200.0" y="222.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">扔掉第一级</text><text x="200.0" y="238.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">剩下的轻多了</text><rect x="318.0" y="172.0" width="24.0" height="28.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M320,172 L330,154 L340,172 Z" stroke="#059669" stroke-width="1.4" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="330.0" y="222.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">扔掉第二级</text><text x="330.0" y="238.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">只剩最后一级</text><path d="M460,190 L470,172 L480,190 Z" stroke="#059669" stroke-width="1.4" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="470.0" y="222.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">载荷入轨</text><line x1="110.0" y1="120.0" x2="154.4" y2="120.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M160.0,120.0 L152.9,123.8 L152.9,116.2 Z" fill="#111827" stroke="none"/><line x1="240.0" y1="120.0" x2="284.4" y2="120.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M290.0,120.0 L282.9,123.8 L282.9,116.2 Z" fill="#111827" stroke="none"/><line x1="370.0" y1="120.0" x2="414.4" y2="120.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M420.0,120.0 L412.9,123.8 L412.9,116.2 Z" fill="#111827" stroke="none"/><text x="260.0" y="26.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">每一级都只推动“更轻的剩余部分”，各级速度增量相加</text><rect x="150.0" y="160.0" width="14.0" height="30.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2"/><text x="157.0" y="152.0" font-size="12" fill="#d97706" text-anchor="middle" font-weight="400">↓</text><rect x="280.0" y="175.0" width="12.0" height="20.0" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3 2"/><text x="286.0" y="168.0" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="400">↓</text></svg>
