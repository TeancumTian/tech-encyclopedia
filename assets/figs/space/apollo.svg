<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Noto Sans CJK SC, sans-serif"><title>阿波罗月球轨道交会</title><circle cx="110.0" cy="175.0" r="60.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="110.0" y="180.0" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">地球</text><circle cx="490.0" cy="175.0" r="34.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="490.0" y="180.0" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">月球</text><circle cx="110.0" cy="175.0" r="74.0" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/><circle cx="490.0" cy="175.0" r="56.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 3"/><path d="M160,123 C230,40 380,50 450,129" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="430.0" y1="123.0" x2="440.7" y2="126.3" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M446.0,128.0 L438.1,129.5 L440.4,122.3 Z" fill="#1d4ed8" stroke="none"/><path d="M450,221 C380,300 230,300 162,223" stroke="#059669" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="180.0" y1="239.0" x2="168.2" y2="228.7" stroke="#059669" stroke-width="2" stroke-linecap="butt"/><path d="M164.0,225.0 L171.8,226.8 L166.8,232.5 Z" fill="#059669" stroke="none"/><line x1="520.0" y1="125.0" x2="508.8" y2="141.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt"/><path d="M506.0,145.0 L506.9,138.1 L512.2,141.8 Z" fill="#dc2626" stroke="none"/><line x1="520.0" y1="205.0" x2="531.2" y2="221.0" stroke="#d97706" stroke-width="2" stroke-linecap="butt"/><path d="M534.0,225.0 L527.8,221.8 L533.1,218.1 Z" fill="#d97706" stroke="none"/><text x="110.0" y="91.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">① 土星五号发射，进入停泊轨道</text><text x="300.0" y="50.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">② 飞往月球（约 3 天）</text><text x="520.0" y="99.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">③ 进入月球轨道</text><text x="530.0" y="149.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">④ 登月舱下降</text><text x="542.0" y="235.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700">⑤ 上升级起飞、对接</text><text x="300.0" y="296.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">⑥ 只有指令舱返回地球</text><text x="490.0" y="255.0" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="400">指令舱留在轨道等待</text><rect x="220.0" y="130.0" width="160.0" height="74.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="300.0" y="152.1" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">关键：月球轨道交会</text><text x="300.0" y="165.4" font-size="10.2" fill="#6b7280" text-anchor="middle" font-weight="400">只让轻巧的登月舱</text><text x="300.0" y="178.1" font-size="10.2" fill="#6b7280" text-anchor="middle" font-weight="400">下到月面再上来</text><text x="300.0" y="190.9" font-size="10.2" fill="#6b7280" text-anchor="middle" font-weight="400">→ 一枚土星五号就够</text><text x="110.0" y="318.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">共约 8 天</text></svg>
