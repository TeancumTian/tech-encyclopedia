<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>卫星导航</title><circle cx="250.0" cy="560.0" r="330.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="243.0" y="216.0" width="14.0" height="22.0" rx="3" fill="#111827" stroke="#111827" stroke-width="1.2"/><text x="250.0" y="256.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">接收机（手机）</text><rect x="64.0" y="65.0" width="12.0" height="10.0" rx="1.5" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><rect x="50.0" y="67.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><rect x="78.0" y="67.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><line x1="70.0" y1="76.0" x2="250.0" y2="216.0" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="70.0" y="58.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">①</text><rect x="184.0" y="31.0" width="12.0" height="10.0" rx="1.5" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><rect x="170.0" y="33.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><rect x="198.0" y="33.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><line x1="190.0" y1="42.0" x2="250.0" y2="216.0" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="190.0" y="24.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">②</text><rect x="324.0" y="39.0" width="12.0" height="10.0" rx="1.5" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><rect x="310.0" y="41.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><rect x="338.0" y="41.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><line x1="330.0" y1="50.0" x2="250.0" y2="216.0" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="330.0" y="32.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">③</text><rect x="434.0" y="85.0" width="12.0" height="10.0" rx="1.5" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><rect x="420.0" y="87.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><rect x="448.0" y="87.0" width="12.0" height="6.0" rx="0.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="0.8"/><line x1="440.0" y1="96.0" x2="250.0" y2="216.0" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="440.0" y="78.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">④</text><text x="110.0" y="150.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">距离 = 光速 × 信号传播时间</text><text x="400.0" y="170.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">4 颗卫星 → 4 个方程</text><text x="400.0" y="188.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">解出 x、y、z 和时钟误差 t</text><rect x="500.0" y="30.0" width="170.0" height="270.0" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="585.0" y="54.0" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="700">星上原子钟每天</text><text x="585.0" y="84.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">速度快 → 慢 7 μs</text><text x="585.0" y="102.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">（狭义相对论）</text><text x="585.0" y="130.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">引力弱 → 快 45 μs</text><text x="585.0" y="148.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">（广义相对论）</text><line x1="520.0" y1="160.0" x2="650.0" y2="160.0" stroke="#7c3aed" stroke-width="1" stroke-linecap="round"/><text x="585.0" y="184.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">合计快约 38 μs</text><text x="585.0" y="214.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">不修正，定位误差</text><text x="585.0" y="232.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">每天累积约 10 公里</text><text x="585.0" y="266.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">1 微秒 ≈ 300 米</text></svg>
