<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>可回收火箭</title><rect x="0.0" y="270.0" width="680.0" height="50.0" rx="0" fill="#e0f2fe" stroke="#e0f2fe" stroke-width="1.2"/><rect x="0.0" y="266.0" width="150.0" height="54.0" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><rect x="40.0" y="256.0" width="30.0" height="10.0" rx="1" fill="#475569" stroke="#475569" stroke-width="1.2"/><path d="M55,254 C70,170 120,90 230,60" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M230,60 C330,30 470,24 650,30" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="640.0" y="20.0" font-size="11" fill="#7c3aed" text-anchor="end" font-weight="700">第二级继续入轨</text><path d="M230,60 C280,40 330,60 360,100 C390,140 430,190 520,250" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="495.0" y="260.0" width="60.0" height="10.0" rx="2" fill="#475569" stroke="#475569" stroke-width="1.2"/><text x="525.0" y="292.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">海上无人船</text><text x="75.0" y="292.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">发射场</text><circle cx="55.0" cy="240.0" r="5.0" fill="#1d4ed8" stroke="#fff" stroke-width="1.4"/><circle cx="230.0" cy="60.0" r="5.0" fill="#1d4ed8" stroke="#fff" stroke-width="1.4"/><circle cx="300.0" cy="52.0" r="5.0" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><circle cx="365.0" cy="108.0" r="5.0" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><circle cx="430.0" cy="175.0" r="5.0" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><circle cx="515.0" cy="238.0" r="5.0" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><circle cx="530.0" cy="256.0" r="5.0" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text x="65.0" y="230.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">① 起飞</text><text x="220.0" y="84.0" font-size="11" fill="#111827" text-anchor="end" font-weight="700">② 一二级分离（约 2.5 分钟）</text><text x="300.0" y="38.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">③ 调头</text><text x="378.0" y="106.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">④ 再入点火：减速、降温</text><text x="442.0" y="172.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">⑤ 栅格舵控制方向</text><text x="560.0" y="232.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">⑥ 着陆点火</text><text x="566.0" y="258.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">⑦ 张开着陆腿落下</text><rect x="170.0" y="140.0" width="190.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="265.0" y="165.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">代价：留出返回燃料</text><text x="265.0" y="178.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">运力比一次性使用少约三成</text><rect x="170.0" y="204.0" width="190.0" height="56.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="265.0" y="229.5" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">收益：最贵的一级反复用</text><text x="265.0" y="242.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">推进剂常不到成本的 1%</text></svg>
