<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="Noto Sans CJK SC, sans-serif"><title>存储层次</title><path d="M200.0,30.0 L260.0,30.0 L298.0,77.0 L162.0,77.0 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="59.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">寄存器</text><text x="450.0" y="59.0" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="700">&lt; 1 ns</text><text x="560.0" y="59.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">数百字节</text><path d="M162.0,80.0 L298.0,80.0 L336.0,127.0 L124.0,127.0 Z" stroke="#7c3aed" stroke-width="1.4" fill="#ede9fe" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="109.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">缓存 L1–L3</text><text x="450.0" y="109.0" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">1–40 ns</text><text x="560.0" y="109.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">KB–MB</text><path d="M124.0,130.0 L336.0,130.0 L374.0,177.0 L86.0,177.0 Z" stroke="#0f766e" stroke-width="1.4" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="159.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">内存 DRAM</text><text x="450.0" y="159.0" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">≈100 ns</text><text x="560.0" y="159.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">GB</text><path d="M86.0,180.0 L374.0,180.0 L412.0,227.0 L48.0,227.0 Z" stroke="#d97706" stroke-width="1.4" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="209.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">固态硬盘 SSD</text><text x="450.0" y="209.0" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="700">≈10–100 µs</text><text x="560.0" y="209.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">TB</text><path d="M48.0,230.0 L412.0,230.0 L450.0,277.0 L10.0,277.0 Z" stroke="#475569" stroke-width="1.4" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="259.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">机械硬盘 / 磁带</text><text x="450.0" y="259.0" font-size="12.5" fill="#475569" text-anchor="start" font-weight="700">≈5–10 ms</text><text x="560.0" y="259.0" font-size="12" fill="#374151" text-anchor="start" font-weight="400">数 TB 起</text><text x="450.0" y="20.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="700">延迟</text><text x="560.0" y="20.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="700">容量</text><line x1="30.0" y1="270.0" x2="30.0" y2="45.6" stroke="#dc2626" stroke-width="2" stroke-linecap="butt"/><path d="M30.0,40.0 L33.8,47.1 L26.2,47.1 Z" fill="#dc2626" stroke="none"/><text x="42.0" y="150.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">更快</text><text x="42.0" y="164.3" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">更贵</text><text x="340.0" y="300.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">上下相邻两层速度常差 10–1000 倍；靠局部性，常用数据总在上层</text></svg>
