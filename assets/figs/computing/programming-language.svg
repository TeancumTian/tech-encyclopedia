<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="Noto Sans CJK SC, sans-serif"><title>抽象的阶梯</title><rect x="30.0" y="20.0" width="470.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/><text x="42.0" y="47.0" font-size="13.5" fill="#059669" text-anchor="start" font-weight="700">Python</text><text x="112.0" y="47.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">total = price * qty</text><text x="530.0" y="47.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="400">人最容易读</text><line x1="70.0" y1="66.0" x2="83.7" y2="73.6" stroke="#059669" stroke-width="1.6" stroke-linecap="butt"/><path d="M88.0,76.0 L81.0,75.9 L84.2,70.1 Z" fill="#059669" stroke="none"/><rect x="54.0" y="76.0" width="446.0" height="44.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/><text x="66.0" y="103.0" font-size="13.5" fill="#0f766e" text-anchor="start" font-weight="700">C 语言</text><text x="136.0" y="103.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">int total = price * qty;</text><text x="530.0" y="103.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="400">接近硬件，但仍可移植</text><line x1="94.0" y1="122.0" x2="107.7" y2="129.6" stroke="#0f766e" stroke-width="1.6" stroke-linecap="butt"/><path d="M112.0,132.0 L105.0,131.9 L108.2,126.1 Z" fill="#0f766e" stroke="none"/><rect x="78.0" y="132.0" width="422.0" height="44.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="90.0" y="159.0" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="700">汇编</text><text x="160.0" y="159.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">mov eax,[price] ; imul eax,[qty] ; mov [total],eax</text><text x="530.0" y="159.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="400">与 CPU 指令一一对应</text><line x1="118.0" y1="178.0" x2="131.7" y2="185.6" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="butt"/><path d="M136.0,188.0 L129.0,187.9 L132.2,182.1 Z" fill="#7c3aed" stroke="none"/><rect x="102.0" y="188.0" width="398.0" height="44.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><text x="114.0" y="215.0" font-size="13.5" fill="#1d4ed8" text-anchor="start" font-weight="700">机器码</text><text x="184.0" y="215.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">8B 05 …  0F AF 05 …  89 05 …</text><text x="530.0" y="215.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="400">CPU 真正执行的数字</text><line x1="142.0" y1="234.0" x2="155.7" y2="241.6" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M160.0,244.0 L153.0,243.9 L156.2,238.1 Z" fill="#1d4ed8" stroke="none"/><rect x="126.0" y="244.0" width="374.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="138.0" y="271.0" font-size="13.5" fill="#475569" text-anchor="start" font-weight="700">电路</text><text x="208.0" y="271.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">数十亿个晶体管开关：1 = 通，0 = 断</text><text x="530.0" y="271.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="400">物理世界</text><text x="20.0" y="305.0" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">↓ 编译器 / 汇编器自动完成每一级翻译；越往上，一行代码能表达的事越多</text></svg>
