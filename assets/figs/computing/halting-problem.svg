<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="Noto Sans CJK SC, sans-serif"><title>停机问题</title><rect x="20.0" y="30.0" width="180.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="110.0" y="51.3" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">假想的判定程序 H</text><text x="110.0" y="65.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">输入任意程序，</text><text x="110.0" y="78.1" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">回答“会停”或“不停”</text><rect x="240.0" y="20.0" width="260.0" height="190.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="370.0" y="42.0" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700">“唱反调”程序 D</text><rect x="270.0" y="56.0" width="200.0" height="34.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="370.0" y="77.1" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">先问 H：“我 D 会停吗？”</text><line x1="200.0" y1="60.0" x2="263.2" y2="71.1" stroke="#475569" stroke-width="1.2" stroke-linecap="butt"/><path d="M268.0,72.0 L261.3,74.2 L262.5,67.7 Z" fill="#475569" stroke="none"/><rect x="256.0" y="120.0" width="110.0" height="70.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="311.0" y="146.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">H 说“会停”</text><text x="311.0" y="159.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">→ D 就进入</text><text x="311.0" y="172.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">死循环</text><rect x="376.0" y="120.0" width="110.0" height="70.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="431.0" y="146.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">H 说“不停”</text><text x="431.0" y="159.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">→ D 立刻</text><text x="431.0" y="172.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">停止</text><line x1="340.0" y1="92.0" x2="315.6" y2="114.7" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="butt"/><path d="M312.0,118.0 L314.3,111.4 L318.8,116.2 Z" fill="#7c3aed" stroke="none"/><line x1="400.0" y1="92.0" x2="426.3" y2="114.8" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="butt"/><path d="M430.0,118.0 L423.2,116.4 L427.5,111.5 Z" fill="#7c3aed" stroke="none"/><rect x="40.0" y="226.0" width="440.0" height="50.0" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><text x="260.0" y="246.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">无论 H 怎么回答都是错的 → 矛盾</text><text x="260.0" y="266.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">所以“万能判定程序”H 根本不可能存在（图灵，1936）</text></svg>
