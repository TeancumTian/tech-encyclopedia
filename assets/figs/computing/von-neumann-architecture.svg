<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>冯·诺依曼结构</title><rect x="30.0" y="40.0" width="270.0" height="200.0" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="165.0" y="64.0" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">CPU 中央处理器</text><rect x="48.0" y="80.0" width="112.0" height="62.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="104.0" y="102.9" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">控制单元</text><text x="104.0" y="116.4" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">取指 · 译码</text><text x="104.0" y="129.1" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">程序计数器 PC</text><rect x="172.0" y="80.0" width="112.0" height="62.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="228.0" y="102.9" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">运算单元 ALU</text><text x="228.0" y="116.4" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">加减 · 比较</text><text x="228.0" y="129.1" font-size="10.14" fill="#6b7280" text-anchor="middle" font-weight="400">逻辑运算</text><rect x="48.0" y="156.0" width="236.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="166.0" y="180.4" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400">寄存器（最快的小存储）</text><text x="165.0" y="224.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">取指 → 译码 → 执行 → 写回 → 再取指…</text><rect x="450.0" y="40.0" width="200.0" height="200.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="550.0" y="64.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">存储器（内存）</text><rect x="470.0" y="78.0" width="160.0" height="24.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="550.0" y="94.1" font-size="11.5" fill="#111827" text-anchor="middle