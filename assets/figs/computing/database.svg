oke="#1d4ed8" stroke-width="0.6"/><text x="160.0" y="99.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">上海</text><rect x="20.0" y="106.0" width="40.0" height="22.0" rx="0" fill="#fef9c3" stroke="#1d4ed8" stroke-width="0.6"/><text x="40.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">3</text><rect x="60.0" y="106.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#1d4ed8" stroke-width="0.6"/><text x="95.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">赵敏</text><rect x="130.0" y="106.0" width="60.0" height="22.0" rx="0" fill="#fef9c3" stroke="#1d4ed8" stroke-width="0.6"/><text x="160.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">北京</text><text x="210.0" y="32.0" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="700">orders 订单表</text><rect x="210.0" y="40.0" width="50.0" height="22.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="0.8"/><text x="235.0" y="55.5" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">no</text><rect x="260.0" y="40.0" width="70.0" height="22.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="0.8"/><text x="295.0" y="55.5" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">cust_id</text><rect x="330.0" y="40.0" width="70.0" height="22.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="0.8"/><text x="365.0" y="55.5" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">amount</text><rect x="210.0" y="62.0" width="50.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="235.0" y="77.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">101</text><rect x="260.0" y="62.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="295.0" y="77.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">1</text><rect x="330.0" y="62.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="365.0" y="77.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">¥88</text><rect x="210.0" y="84.0" width="50.0" height="22.0" rx="0" fill="#fff" stroke="#d97706" stroke-width="0.6"/><text x="235.0" y="99.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">102</text><rect x="260.0" y="84.0" width="70.0" height="22.0" rx="0" fill="#fff" stroke="#d97706" stroke-width="0.6"/><text x="295.0" y="99.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">2</text><rect x="330.0" y="84.0" width="70.0" height="22.0" rx="0" fill="#fff" stroke="#d97706" stroke-width="0.6"/><text x="365.0" y="99.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">¥45</text><rect x="210.0" y="106.0" width="50.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="235.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">103</text><rect x="260.0" y="106.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="295.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">3</text><rect x="330.0" y="106.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="365.0" y="121.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">¥120</text><rect x="210.0" y="128.0" width="50.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="235.0" y="143.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">104</text><rect x="260.0" y="128.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="295.0" y="143.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">1</text><rect x="330.0" y="128.0" width="70.0" height="22.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="0.6"/><text x="365.0" y="143.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">¥19</text><path d="M40.0,130.0 Q160.0,200.0 295.0,152.0" stroke="#059669" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M295.0,152.0 L289.6,157.9 L287.1,150.8 Z" fill="#059669" stroke="none"/><text x="170.0" y="192.0" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="700">通过“键”关联：订单的 cust_id 指向客户的 id</text><rect x="440.0" y="30.0" width="220.0" height="122.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/><text x="452.0" y="54.0" font-size="10.6" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">SELECT c.name, o.amount</text><text x="452.0" y="74.0" font-size="10.6" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">FROM customers c</text><text x="452.0" y="94.0" font-size="10.6" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">JOIN orders o</text><text x="452.0" y="114.0" font-size="10.6" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">  ON o.cust_id = c.id</text><text x="452.0" y="134.0" font-size="10.6" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">WHERE c.city = &#x27;北京&#x27;;</text><text x="550.0" y="170.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">只说“要什么”，不说“怎么找”</text><line x1="550.0" y1="178.0" x2="550.0" y2="194.4" stroke="#059669" stroke-width="1.5" stroke-linecap="butt"/><path d="M550.0,200.0 L546.2,192.9 L553.8,192.9 Z" fill="#059669" stroke="none"/><text x="470.0" y="202.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">结果</text><rect x="470.0" y="210.0" width="80.0" height="22.0" rx="0" fill="#059669" stroke="#059669" stroke-width="0.8"/><text x="510.0" y="225.5" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">name</text><rect x="550.0" y="210.0" width="80.0" height="22.0" rx="0" fill="#059669" stroke="#059669" stroke-width="0.8"/><text x="590.0" y="225.5" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">amount</text><rect x="470.0" y="232.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="510.0" y="247.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">王芳</text><rect x="550.0" y="232.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="590.0" y="247.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">¥88</text><rect x="470.0" y="254.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="510.0" y="269.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">赵敏</text><rect x="550.0" y="254.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="590.0" y="269.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">¥120</text><rect x="470.0" y="276.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="510.0" y="291.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">王芳</text><rect x="550.0" y="276.0" width="80.0" height="22.0" rx="0" fill="#fff" stroke="#059669" stroke-width="0.6"/><text x="590.0" y="291.5" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">¥19</text><text x="20.0" y="236.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">数据库替你决定：先查索引、再连表、再过滤——</text><text x="20.0" y="254.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">十亿行里找几行，也只需几次磁盘读取</text></svg>
