<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="Noto Sans CJK SC, sans-serif"><title>图形界面简史</title><line x1="20.0" y1="60.0" x2="660.0" y2="60.0" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><circle cx="70.0" cy="60.0" r="8.0" fill="#475569" stroke="#fff" stroke-width="2"/><text x="70.0" y="44.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">1968</text><rect x="20.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="70.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">演示之母</text><text x="70.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">恩格尔巴特：</text><text x="70.0" y="143.2" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">鼠标、窗口、超文本</text><circle cx="178.0" cy="60.0" r="8.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><text x="178.0" y="44.0" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">1973</text><rect x="128.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="178.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">施乐 Alto</text><text x="178.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">第一个完整的</text><text x="178.0" y="143.2" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">图形桌面</text><circle cx="286.0" cy="60.0" r="8.0" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="286.0" y="44.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">1984</text><rect x="236.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="286.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">Macintosh</text><text x="286.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">图形界面</text><text x="286.0" y="143.2" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">走进大众</text><circle cx="394.0" cy="60.0" r="8.0" fill="#d97706" stroke="#fff" stroke-width="2"/><text x="394.0" y="44.0" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">1995</text><rect x="344.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="394.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">Windows 95</text><text x="394.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">开始菜单、任务栏</text><text x="394.0" y="143.2" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">普及到亿万人</text><circle cx="502.0" cy="60.0" r="8.0" fill="#059669" stroke="#fff" stroke-width="2"/><text x="502.0" y="44.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">2007</text><rect x="452.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="502.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">iPhone</text><text x="502.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">多点触控：</text><text x="502.0" y="143.2" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">手指直接操作</text><circle cx="610.0" cy="60.0" r="8.0" fill="#db2777" stroke="#fff" stroke-width="2"/><text x="610.0" y="44.0" font-size="14" fill="#db2777" text-anchor="middle" font-weight="700">今天</text><rect x="560.0" y="80.0" width="100.0" height="104.0" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" stroke-dasharray="4 3"/><text x="610.0" y="104.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">对话式界面</text><text x="610.0" y="128.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">用自然语言</text><text x="610.0" y="143.2" font-size="10.5" fill="#374151" text-anchor=