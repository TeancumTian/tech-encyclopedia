<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>操作系统的分层</title><rect x="30.0" y="20.0" width="620.0" height="54.0" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.4"/><text x="44.0" y="52.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">应用程序</text><rect x="158.0" y="29.0" width="112.5" height="36.0" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/><text x="214.2" y="51.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">浏览器</text><rect x="280.5" y="29.0" width="112.5" height="36.0" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/><text x="336.8" y="51.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">微信</text><rect x="403.0" y="29.0" width="112.5" height="36.0" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/><text x="459.2" y="51.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">游戏</text><rect x="525.5" y="29.0" width="112.5" height="36.0" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/><text x="581.8" y="51.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">代码编辑器</text><rect x="30.0" y="84.0" width="620.0" height="26.0" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/><text x="340.0" y="102.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">系统调用：open() · read() · write() · fork() …（应用和内核之间唯一的门）</text><rect x="30.0" y="120.0" width="620.0" height="106.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="44.0" y="178.0" font-size="15" fill="#059669" text-anchor="start" font-weight="700">内核</text><rect x="110.0" y="130.0" width="122.0" height="44.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="171.0" y="150.3" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">进程调度</text><text x="171.0" y="163.3" font-size="9.75" fill="#fff" text-anchor="middle" font-weight="400">谁用 CPU</text><rect x="242.0" y="130.0" width="122.0" height="44.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="303.0" y="150.3" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">内存管理</text><text x="303.0" y="163.3" font-size="9.75" fill="#fff" text-anchor="middle" font-weight="400">虚拟内存</text><rect x="374.0" y="130.0" width="122.0" height="44.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="435.0" y="150.3" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">文件系统</text><text x="435.0" y="163.3" font-size="9.75" fill="#fff" text-anchor="middle" font-weight="400">文件与目录</text><rect x="506.0" y="130.0" width="122.0" height="44.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="567.0" y="150.3" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">网络协议栈</text><text x="567.0" y="163.3" font-size="9.75" fill="#fff" text-anchor="middle" font-weight="400">TCP/IP</text><rect x="110.0" y="182.0" width="518.0" height="36.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="369.0" y="204.1" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">设备驱动程序：把“读一块数据”翻译成具体硬件的命令</text><rect x="30.0" y="236.0" width="620.0" height="54.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="44.0" y="268.0" font-size="13" fill="#475569" text-anchor="start" font-weight="700">硬件</text><rect x="158.0" y="245.0" width="112.5" height="36.0" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="214.2" y="267.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">CPU</text><rect x="280.5" y="245.0" width="112.5" height="36.0" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="336.8" y="267.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">内存</text><rect x="403.0" y="245.0" width="112.5" height="36.0" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="459.2" y="267.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">磁盘 / SSD</text><rect x="525.5" y="245.0" width="112.5" height="36.0" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="581.8" y="267.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">网卡 · 显卡</text><line x1="660.0" y1="35.6" x2="660.0" y2="274.4" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="butt"/><path d="M660.0,280.0 L656.2,272.9 L663.8,272.9 Z" fill="#9ca3af" stroke="none"/><path d="M660.0,30.0 L663.8,37.1 L656.2,37.1 Z" fill="#9ca3af" stroke="none"/><text x="340.0" y="312.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">应用不能直接碰硬件——必须请内核代办：既保证安全，也让同一程序跑在不同硬件上</text></svg>
