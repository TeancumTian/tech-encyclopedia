<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="Noto Sans CJK SC, sans-serif"><title>P 与 NP</title><path d="M30,145 C30,40 450,40 450,145 C450,250 30,250 30,145 Z" stroke="#1d4ed8" stroke-width="1.8" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="92.0" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">NP：答案容易验证</text><path d="M60,160 C60,110 230,110 230,160 C230,210 60,210 60,160 Z" stroke="#059669" stroke-width="1.6" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="145.0" y="145.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">P：容易求解</text><text x="145.0" y="168.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">排序 · 最短路径</text><text x="145.0" y="181.7" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">查找 · 判断素数</text><path d="M300,95 C390,100 425,130 420,160 C412,195 360,215 300,205 C330,180 330,120 300,95 Z" stroke="#dc2626" stroke-width="1.6" fill="#fee2e2" stroke-linejoin="round" stroke-linecap="round"/><text x="372.0" y="130.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">NP 完全</text><text x="370.0" y="152.0" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">旅行商</text><text x="370.0" y="165.7" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">排课 · 数独</text><text x="370.0" y="179.3" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="400">背包问题</text><text x="240.0" y="268.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">百万美元之问：P 和 NP 其实是同一个圈吗？多数人认为不是（P ≠ NP）</text><text x="490.0" y="30.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400">大圈之外还有更难的：例如停机问题根本不可计算</text></svg>
