middle" font-weight="400">8</text><rect x="310.0" y="40.0" width="50.0" height="48.0" rx="0" fill="#fff" stroke="#1d4ed8" stroke-width="1.4"/><text x="335.0" y="72.0" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">0</text><text x="335.0" y="106.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">4</text><rect x="360.0" y="40.0" width="50.0" height="48.0" rx="0" fill="#fff" stroke="#1d4ed8" stroke-width="1.4"/><text x="385.0" y="72.0" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">0</text><text x="385.0" y="106.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">2</text><rect x="410.0" y="40.0" width="50.0" height="48.0" rx="0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.4"/><text x="435.0" y="72.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">1</text><text x="435.0" y="106.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">1</text><text x="30.0" y="106.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">位值</text><rect x="40.0" y="140.0" width="200.0" height="70.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="140.0" y="169.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">当作整数</text><text x="140.0" y="188.8" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="400">64 + 1 = 65</text><rect x="280.0" y="140.0" width="200.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="380.0" y="167.1" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">当作 ASCII 字符</text><text x="380.0" y="190.2" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="400">“A”</text><line x1="200.0" y1="116.0" x2="155.2" y2="133.9" stroke="#059669" stroke-width="1.5" stroke-linecap="butt"/><path d="M150.0,