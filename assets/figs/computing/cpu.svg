<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Noto Sans CJK SC, sans-serif"><title>CPU 的指令循环</title><circle cx="250.0" cy="150.0" r="92.0" fill="none" stroke="#cbd5e1" stroke-width="10"/><path d="M278.4,62.5 A92,92 0 0 1 337.5,121.6" stroke="#64748b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M337.5,121.6 L330.3,114.6 L339.2,111.7 Z" fill="#64748b" stroke="none"/><path d="M337.5,178.4 A92,92 0 0 1 278.4,237.5" stroke="#64748b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M278.4,237.5 L285.4,230.3 L288.3,239.2 Z" fill="#64748b" stroke="none"/><path d="M221.6,237.5 A92,92 0 0 1 162.5,178.4" stroke="#64748b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M162.5,178.4 L169.7,185.4 L160.8,188.3 Z" fill="#64748b" stroke="none"/><path d="M162.5,121.6 A92,92 0 0 1 221.6,62.5" stroke="#64748b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M221.6,62.5 L214.6,69.7 L211.7,60.8 Z" fill="#64748b" stroke="none"/><rect x="198.0" y="41.0" width="104.0" height="34.0" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><text x="250.0" y="62.8" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">① 取指</text><text x="375.0" y="52.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">按 PC 地址从内存</text><text x="375.0" y="66.3" font-size="11" fill="#374151" text-anchor="start" font-weight="400">读出下一条指令</text><rect x="290.0" y="133.0" width="104.0" height="34.0" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><text x="342.0" y="154.8" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">② 译码</text><text x="400.0" y="147.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">看懂指令：做什么、</text><text x="400.0" y="161.3" font-size="11" fill="#374151" text-anchor="start" font-weight="400">操作哪些数据</text><rect x="198.0" y="225.0" width="104.0" height="34.0" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><text x="250.0" y="246.8" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">③ 执行</text><text x="312.0" y="244.0" font-size="11" fill="#374151" text-anchor="start" font-weight="400">ALU 计算，</text><text x="312.0" y="258.3" font-size="11" fill="#374151" text-anchor="start" font-weight="400">或跳转、读写内存</text><rect x="106.0" y="133.0" width="104.0" height="34.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.2"/><text x="158.0" y="154.8" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">④ 写回</text><text x="100.0" y="147.0" font-size="11" fill="#374151" text-anchor="end" font-weight="400">结果存进寄存器，</text><text x="100.0" y="161.3" font-size="11" fill="#374151" text-anchor="end" font-weight="400">PC 指向下一条</text><text x="250.0" y="146.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">每秒循环</text><text x="250.0" y="166.0" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">数十亿次</text><rect x="520.0" y="40.0" width="140.0" height="210.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="590.0" y="62.0" font-size="13.5" fill="#d97706" text-anchor="middle" font-weight="700">内存</text><rect x="530.0" y="74.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="88.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">100: LOAD R1, [200]</text><rect x="530.0" y="98.0" width="120.0" height="20.0" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/><text x="536.0" y="112.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">101: ADD R1, 5</text><rect x="530.0" y="122.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="136.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">102: STORE R1, [201]</text><rect x="530.0" y="146.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="160.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">103: JUMP 100</text><rect x="530.0" y="170.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="184.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">…</text><rect x="530.0" y="194.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="208.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">200: 37</text><rect x="530.0" y="218.0" width="120.0" height="20.0" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.8"/><text x="536.0" y="232.0" font-size="9.6" fill="#111827" text-anchor="start" font-weight="400" font-family="Noto Sans Mono CJK SC,monospace">201: 42</text><text x="590.0" y="268.0" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="Noto Sans Mono CJK SC,monospace">PC = 101</text><line x1="440.0" y1="98.0" x2="520.4" y2="98.0" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 3"/><path d="M526.0,98.0 L518.9,101.8 L518.9,94.2 Z" fill="#1d4ed8" stroke="none"/></svg>
