<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="Noto Sans CJK SC, sans-serif"><title>Git 分支</title><text x="20.0" y="75.0" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="700">main</text><text x="20.0" y="145.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">feature</text><line x1="100.0" y1="70.0" x2="470.0" y2="70.0" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><path d="M170,70 C200,70 200,140 230,140 L330,140 C360,140 360,70 380,70" stroke="#059669" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="170.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="240.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="380.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="450.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="240.0" cy="140.0" r="9.0" fill="#059669" stroke="#fff" stroke-width="2"/><circle cx="300.0" cy="140.0" r="9.0" fill="#059669" stroke="#fff" stroke-width="2"/><circle cx="380.0" cy="70.0" r="12.0" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="170.0" y="52.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">分出分支</text><text x="270.0" y="170.0" font-size="11" fill="#059669" text-anchor="middle" font-weight="400">在分支上提交（不影响主线）</text><text x="380.0" y="50.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="700">合并 merge</text><text x="240.0" y="52.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">别人也在提交</text><text x="260.0" y="194.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">每个圆点都是一次“提交”快照：随时可以回到任何一个</text></svg>
