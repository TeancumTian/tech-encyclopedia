<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="Noto Sans CJK SC, sans-serif"><title>个人电脑的关键几步</title><line x1="30.0" y1="70.0" x2="650.0" y2="70.0" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><line x1="640.0" y1="70.0" x2="654.3" y2="70.0" stroke="#9ca3af" stroke-width="3" stroke-linecap="butt"/><path d="M662.0,70.0 L652.3,75.2 L652.3,64.8 Z" fill="#9ca3af" stroke="none"/><circle cx="80.0" cy="70.0" r="9.0" fill="#475569" stroke="#fff" stroke-width="2"/><text x="80.0" y="50.0" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">1975</text><rect x="20.0" y="92.0" width="120.0" height="104.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="80.0" y="116.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">Altair 8800</text><text x="80.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">爱好者套件</text><text x="80.0" y="157.9" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">自己焊接、拨开关编程</text><circle cx="210.0" cy="70.0" r="9.0" fill="#059669" stroke="#fff" stroke-width="2"/><text x="210.0" y="50.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">1977</text><rect x="150.0" y="92.0" width="120.0" height="104.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="210.0" y="116.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">Apple II 等</text><text x="210.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">开箱即用的整机</text><text x="210.0" y="157.9" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">起价 1298 美元</text><circle cx="340.0" cy="70.0" r="9.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><text x="340.0" y="50.0" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">1981</text><rect x="280.0" y="92.0" width="120.0" height="104.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="340.0" y="116.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">IBM PC</text><text x="340.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">开放架构</text><text x="340.0" y="157.9" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">兼容机成为标准</text><circle cx="470.0" cy="70.0" r="9.0" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="470.0" y="50.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">1984</text><rect x="410.0" y="92.0" width="120.0" height="104.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="470.0" y="116.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">Macintosh</text><text x="470.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">图形界面 + 鼠标</text><text x="470.0" y="157.9" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">走进大众</text><circle cx="600.0" cy="70.0" r="9.0" fill="#d97706" stroke="#fff" stroke-width="2"/><text x="600.0" y="50.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">1995</text><rect x="540.0" y="92.0" width="120.0" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="600.0" y="116.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">Windows 95</text><text x="600.0" y="142.0" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">开始菜单 + 上网</text><text x="600.0" y="157.9" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">电脑进入千家万户</text><text x="340.0" y="222.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">价格每跌破一道门槛，用户和软件就多一个数量级</text></svg>
