<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>铁路</title><text x="170.0" y="26.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">拉动 1 吨重物所需的滚动阻力（典型量级）</text><text x="20.0" y="64.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">钢轮—钢轨</text><rect x="20.0" y="72.0" width="14.2" height="20.0" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><text x="42.2" y="87.0" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="700">约 10–20 牛</text><text x="20.0" y="122.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">汽车轮胎—沥青路</text><rect x="20.0" y="130.0" width="95.0" height="20.0" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><text x="123.0" y="145.0" font-size="11.5" fill="#d97706" text-anchor="start" font-weight="700">约 100 牛</text><text x="20.0" y="180.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">轮胎—松软土路</text><rect x="20.0" y="188.0" width="285.0" height="20.0" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><text x="313.0" y="203.0" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">数百牛</text><text x="170.0" y="236.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">同样的牵引力，在铁轨上能拉动重得多的货物</text><text x="170.0" y="254.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">（阻力系数：钢轨约 0.001–0.002，公路轮胎约 0.01）</text><text x="515.0" y="26.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">锥形踏面：列车自己“找正”</text><rect x="400.0" y="188.0" width="20.0" height="14.0" rx="2" fill="#475569" stroke="#475569" stroke-width="1.2"/><rect x="600.0" y="188.0" width="20.0" height="14.0" rx="2" fill="#475569" stroke="#475569" stroke-width="1.2"/><line x1="380.0" y1="202.0" x2="660.0" y2="202.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/><rect x="400.0" y="128.0" width="240.0" height="8.0" rx="3" fill="#9ca3af" stroke="#6b7280" stroke-width="1.2"/><path d="M388.0,80.0 L432.0,72.0 L432.0,192.0 L388.0,184.0 Z" stroke="#1d4ed8" stroke-width="1.6" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><rect x="432.0" y="64.0" width="6.0" height="136.0" rx="2" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><path d="M632.0,80.0 L588.0,72.0 L588.0,192.0 L632.0,184.0 Z" stroke="#1d4ed8" stroke-width="1.6" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><rect x="582.0" y="64.0" width="6.0" height="136.0" rx="2" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><text x="440.0" y="60.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">轮缘</text><text x="580.0" y="60.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">轮缘</text><rect x="368.0" y="218.0" width="300.0" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="518.0" y="235.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">过弯时离心作用把轮对推向外轨</text><text x="518.0" y="248.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">外侧车轮滚在“大直径”处、内侧在“小直径”处</text><text x="518.0" y="261.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">两轮一快一慢，自动转向弯道</text><text x="510.0" y="118.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">车轴（两轮刚性相连）</text></svg>
