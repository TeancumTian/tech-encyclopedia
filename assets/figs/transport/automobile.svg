oke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><circle cx="130.0" cy="205.0" r="4.0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/><rect x="20.0" y="248.0" width="140.0" height="40.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="90.0" y="266.1" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">③ 底盘</text><text x="90.0" y="279.0" font-size="9.8" fill="#6b7280" text-anchor="middle" font-weight="400">悬架·转向·制动·轮胎</text><line x1="230.0" y1="112.0" x2="230.0" y2="50.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><circle cx="230.0" cy="112.0" r="4.0" fill="#475569" stroke="#475569" stroke-width="1.2"/><rect x="160.0" y="30.0" width="140.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="230.0" y="48.1" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">④ 车身</text><text x="230.0" y="61.0" font-size="9.8" fill="#6b7280" text-anchor="middle" font-weight="400">乘员舱·吸能结构</text><line x1="380.0" y1="142.0" x2="520.0" y2="50.0" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><circle cx="380.0" cy="142.0" r="4.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><rect x="450.0" y="30.0" width="140.0" height="40.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="520.0" y="48.1" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">⑤ 电子电气</text><text x="520.0" y="61.0" font-size="9.8" fill="#6b7280" text-anchor="middle" font-weight="400">几十到上百个控制单元</text><text x="340.0" y="312.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">燃油车 → 电动车：①② 变化最大（电池+电机，通常只需单级减速器）</text><text x="340.0" y="330.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">③④ 大体不变；⑤ 越来越像一台装在轮子上的电脑</text></svg>
