<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>高速铁路的空气阻力</title><line x1="70.0" y1="250.0" x2="430.0" y2="250.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="70.0" y1="40.0" x2="70.0" y2="250.0" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="70.0" y1="250.0" x2="70.0" y2="254.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="268.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">0</text><line x1="160.0" y1="250.0" x2="160.0" y2="254.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="160.0" y="268.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">100</text><line x1="250.0" y1="250.0" x2="250.0" y2="254.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="250.0" y="268.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">200</text><line x1="340.0" y1="250.0" x2="340.0" y2="254.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="340.0" y="268.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">300</text><line x1="430.0" y1="250.0" x2="430.0" y2="254.0" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="430.0" y="268.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">400</text><text x="250.0" y="286.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">速度（公里/小时）</text><line x1="66.0" y1="246.7" x2="70.0" y2="246.7" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="62.0" y="250.7" font-size="10.5" fill="#111827" text-anchor="end" font-weight="400">×1</text><line x1="66.0" y1="223.8" x2="70.0" y2="223.8" stroke="#111827" stroke-width="1" stroke-linecap="round"/><text x="62.0" y="227.8" font-size="10.5" fill="#111827" text-anchor="end" font-weight="400">×8</text><line x1="66.0" y1="197.5" x2="70.0" y2="197.5" stroke="#111827" s