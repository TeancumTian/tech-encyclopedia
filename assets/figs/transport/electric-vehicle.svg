<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Noto Sans CJK SC, sans-serif"><title>能量到达车轮的比例</title><text x="340.0" y="24.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">同样 100 份能量，有多少真正推动了车轮？</text><text x="110.0" y="72.0" font-size="13" fill="#111827" text-anchor="end" font-weight="700">汽油车</text><rect x="120.0" y="46.0" width="109.2" height="42.0" rx="3" fill="#059669" stroke="#059669" stroke-width="1"/><text x="174.6" y="65.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">到达车轮</text><text x="174.6" y="80.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">约 12–30%</text><rect x="229.2" y="46.0" width="410.8" height="42.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="434.6" y="65.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">发动机废热、排气、怠速和传动损失</text><text x="434.6" y="80.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">约 70–88%</text><text x="110.0" y="142.0" font-size="13" fill="#111827" text-anchor="end" font-weight="700">电动车</text><rect x="120.0" y="116.0" width="416.0" height="42.0" rx="3" fill="#059669" stroke="#059669" stroke-width="1"/><text x="328.0" y="135.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">到达车轮（含刹车回收）</text><text x="328.0" y="150.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">77% 以上</text><rect x="536.0" y="116.0" width="104.0" height="42.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="588.0" y="135.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">充电、电控</text><text x="588.0" y="150.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">和电机损失</text><text x="340.0" y="192.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">差距来自热机的卡诺极限：燃油车的能量大部分以热的形式散掉；电动机没有这个限制。</text><text x="340.0" y="212.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">电动车的总排放还取决于发电方式——煤电多的地方优势变小，清洁电多的地方优势变大。</text><text x="340.0" y="236.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">数据：美国能源部 fueleconomy.gov（电动车按电网到车轮计）</text></svg>
