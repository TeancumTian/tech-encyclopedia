<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Noto Sans CJK SC, sans-serif"><title>自动驾驶</title><rect x="40.0" y="40.0" width="160.0" height="74.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="120.0" y="68.8" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">感知</text><text x="120.0" y="82.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">摄像头 · 雷达 · 激光雷达</text><text x="120.0" y="96.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">定位与地图</text><rect x="260.0" y="40.0" width="160.0" height="74.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="340.0" y="68.8" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">预测</text><text x="340.0" y="82.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">其他车辆和行人</text><text x="340.0" y="96.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">几秒后会在哪里</text><rect x="480.0" y="40.0" width="160.0" height="74.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="560.0" y="68.8" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">规划</text><text x="560.0" y="82.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">选一条安全、舒适</text><text x="560.0" y="96.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">合乎规则的轨迹</text><rect x="480.0" y="150.0" width="160.0" height="74.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="560.0" y="185.4" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">控制</text><text x="560.0" y="199.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">转向 · 油门 · 制动</text><line x1="202.0" y1="77.0" x2="252.4" y2="77.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M258.0,77.0 L250.9,80.8 L250.9,73.2 Z" fill="#111827" stroke="none"/><line x1="422.0" y1="77.0" x2="472.4" y2="77.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M478.0,77.0 L470.9,80.8 L470.9,73.2 Z" fill="#111827" stroke="none"/><line x1="560.0" y1="116.0" x2="560.0" y2="142.4" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M560.0,148.0 L556.2,140.9 L563.8,140.9 Z" fill="#111827" stroke="none"/><rect x="260.0" y="150.0" width="160.0" height="74.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="340.0" y="185.4" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">车辆与环境</text><text x="340.0" y="199.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">车动了，世界也在变</text><line x1="478.0" y1="187.0" x2="427.6" y2="187.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M422.0,187.0 L429.1,183.2 L429.1,190.8 Z" fill="#111827" stroke="none"/><path d="M258.0,187.0 Q120.0,190.0 120.0,116.0" stroke="#1d4ed8" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M120.0,116.0 L123.8,123.1 L116.2,123.1 Z" fill="#1d4ed8" stroke="none"/><text x="130.0" y="200.0" font-size="10.5" fill="#1d4ed8" text-anchor="end" font-weight="400">再次测量（每秒数十次）</text><text x="20.0" y="242.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">SAE 分级</text><rect x="22.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="73.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L0</text><text x="73.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">无自动化</text><rect x="128.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="179.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L1</text><text x="179.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">单项辅助</text><rect x="234.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="285.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L2</text><text x="285.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">组合辅助</text><rect x="340.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="391.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L3</text><text x="391.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">有条件自动</text><rect x="446.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="497.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L4</text><text x="497.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">限定区域无人</text><rect x="552.0" y="248.0" width="102.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="603.0" y="268.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">L5</text><text x="603.0" y="281.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">任何条件无人</text><line x1="338.0" y1="240.0" x2="338.0" y2="300.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="330.0" y="318.0" font-size="11" fill="#d97706" text-anchor="end" font-weight="700">← 人必须全程监督</text><text x="346.0" y="318.0" font-size="11" fill="#059669" text-anchor="start" font-weight="700">系统负责驾驶 →</text></svg>
