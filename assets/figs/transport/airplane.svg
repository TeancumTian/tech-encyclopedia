<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>飞机的四个力与三根轴</title><path d="M60,160 C80,148 120,144 300,146 L360,150 C380,152 390,158 380,166 L300,170 L80,170 C66,170 56,166 60,160 Z" stroke="#475569" stroke-width="1.6" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><path d="M80,148 L60,110 L80,110 L110,147 Z" stroke="#475569" stroke-width="1.4" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><path d="M170,160 L240,160 L260,168 L170,168 Z" stroke="#1d4ed8" stroke-width="1.2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><line x1="220.0" y1="154.0" x2="220.0" y2="73.0" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="butt"/><path d="M220.0,66.0 L224.7,74.8 L215.3,74.8 Z" fill="#1d4ed8" stroke="none"/><text x="228.0" y="78.0" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="700">升力</text><line x1="220.0" y1="172.0" x2="220.0" y2="243.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="butt"/><path d="M220.0,250.0 L215.3,241.2 L224.7,241.2 Z" fill="#dc2626" stroke="none"/><text x="228.0" y="244.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">重力</text><line x1="388.0" y1="158.0" x2="443.0" y2="158.0" stroke="#059669" stroke-width="2.6" stroke-linecap="butt"/><path d="M450.0,158.0 L441.2,162.7 L441.2,153.3 Z" fill="#059669" stroke="none"/><text x="420.0" y="148.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">推力</text><line x1="56.0" y1="158.0" x2="13.0" y2="158.0" stroke="#d97706" stroke-width="2.6" stroke-linecap="butt"/><path d="M6.0,158.0 L14.8,153.3 L14.8,162.7 Z" fill="#d97706" stroke="none"/><text x="26.0" y="148.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">阻力</text><text x="230.0" y="290.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">匀速平飞：升力 = 重力，推力 = 阻力</text><text x="230.0" y="308.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">升力 ∝ 空气密度 × 机翼面积 × 速度²</text><text x="570.0" y="34.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">三组舵面 ↔ 三根轴</text><path d="M565,50 L575,50 L578,260 L562,260 Z" stroke="#475569" stroke-width="1.2" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><path d="M570,110 L665,155 L665,170 L570,150 L475,170 L475,155 Z" stroke="#475569" stroke-width="1.2" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><path d="M570,230 L615,252 L615,260 L525,260 L525,252 Z" stroke="#475569" stroke-width="1.2" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/><rect x="620.0" y="158.0" width="40.0" height="9.0" rx="1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><rect x="480.0" y="158.0" width="40.0" height="9.0" rx="1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><rect x="528.0" y="256.0" width="84.0" height="6.0" rx="1" fill="#0f766e" stroke="#0f766e" stroke-width="1.2"/><rect x="567.0" y="244.0" width="6.0" height="18.0" rx="1" fill="#db2777" stroke="#db2777" stroke-width="1.2"/><text x="640.0" y="184.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">副翼 → 滚转</text><text x="500.0" y="184.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">副翼</text><text x="500.0" y="282.0" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">升降舵 → 俯仰</text><text x="635.0" y="282.0" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">方向舵 → 偏航</text><text x="570.0" y="310.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">（俯视图）</text></svg>
