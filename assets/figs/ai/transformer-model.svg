<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Noto Sans CJK SC, sans-serif"><title>Transformer 的结构</title><rect x="82.0" y="330.0" width="76.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="120.0" y="349.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">小猫</text><line x1="120.0" y1="328.0" x2="120.0" y2="305.6" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M120.0,300.0 L123.8,307.1 L116.2,307.1 Z" fill="#475569" stroke="none"/><rect x="172.0" y="330.0" width="76.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="210.0" y="349.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">没有</text><line x1="210.0" y1="328.0" x2="210.0" y2="305.6" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M210.0,300.0 L213.8,307.1 L206.2,307.1 Z" fill="#475569" stroke="none"/><rect x="262.0" y="330.0" width="76.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="300.0" y="349.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">过</text><line x1="300.0" y1="328.0" x2="300.0" y2="305.6" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M300.0,300.0 L303.8,307.1 L296.2,307.1 Z" fill="#475569" stroke="none"/><rect x="352.0" y="330.0" width="76.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="390.0" y="349.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">马路</text><line x1="390.0" y1="328.0" x2="390.0" y2="305.6" stroke="#475569" stroke-width="1.5" stroke-linecap="butt"/><path d="M390.0,300.0 L393.8,307.1 L386.2,307.1 Z" fill="#475569" stroke="none"/><rect x="70.0" y="266.0" width="370.0" height="32.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="255.0" y="286.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">词嵌入 + 位置编码（每个词变成一串数字）</text><rect x="60.0" y="70.0" width="390.0" height="186.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470.0" y="168.0" font-size="16" fill="#1d4ed8" text-anchor="start" font-weight="700">× N 层</text><text x="470.0" y="188.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">（几十到上百层）</text><rect x="80.0" y="186.0" width="350.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="255.0" y="212.1" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">自注意力</text><text x="255.0" y="226.6" font-size="10.92" fill="#6b7280" text-anchor="middle" font-weight="400">每个词“看”所有其他词，决定从谁那里取信息</text><rect x="80.0" y="104.0" width="350.0" height="56.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="255.0" y="130.1" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">前馈网络</text><text x="255.0" y="144.6" font-size="10.92" fill="#6b7280" text-anchor="middle" font-weight="400">每个词各自再加工一遍</text><line x1="255.0" y1="186.0" x2="255.0" y2="167.6" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M255.0,162.0 L258.8,169.1 L251.2,169.1 Z" fill="#1d4ed8" stroke="none"/><text x="70.0" y="92.0" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">（每个子层都有“残差连接 + 归一化”，便于堆深）</text><line x1="255.0" y1="104.0" x2="255.0" y2="69.6" stroke="#059669" stroke-width="2" stroke-linecap="butt"/><path d="M255.0,64.0 L258.8,71.1 L251.2,71.1 Z" fill="#059669" stroke="none"/><rect x="150.0" y="22.0" width="210.0" height="40.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="255.0" y="46.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输出：下一个词的概率</text><text x="540.0" y="250.0" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">要点：</text><text x="540.0" y="264.9" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">所有词并行处理，</text><text x="540.0" y="279.9" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">不像 RNN 逐个读，</text><text x="540.0" y="294.9" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">因此能用 GPU</text><text x="540.0" y="309.8" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400">高效训练超大模型</text></svg>
