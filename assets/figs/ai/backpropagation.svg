<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Noto Sans CJK SC, sans-serif"><title>前向传播与反向传播</title><rect x="20.0" y="110.0" width="110.0" height="64.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="75.0" y="146.8" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">输入</text><rect x="150.0" y="110.0" width="110.0" height="64.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="205.0" y="146.8" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">第 1 层</text><rect x="280.0" y="110.0" width="110.0" height="64.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="335.0" y="146.8" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">第 2 层</text><rect x="410.0" y="110.0" width="110.0" height="64.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="465.0" y="140.5" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">输出</text><text x="465.0" y="154.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">预测值</text><rect x="540.0" y="110.0" width="125.0" height="64.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="602.5" y="140.5" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">损失</text><text x="602.5" y="154.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">和正确答案差多少</text><line x1="132.0" y1="128.0" x2="142.4" y2="128.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M148.0,128.0 L140.9,131.8 L140.9,124.2 Z" fill="#1d4ed8" stroke="none"/><line x1="262.0" y1="128.0" x2="272.4" y2="128.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M278.0,128.0 L270.9,131.8 L270.9,124.2 Z" fill="#1d4ed8" stroke="none"/><line x1="392.0" y1="128.0" x2="402.4" y2="128.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M408.0,128.0 L400.9,131.8 L400.9,124.2 Z" fill="#1d4ed8" stroke="none"/><line x1="522.0" y1="128.0" x2="532.4" y2="128.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="butt"/><path d="M538.0,128.0 L530.9,131.8 L530.9,124.2 Z" fill="#1d4ed8" stroke="none"/><text x="330.0" y="62.0" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">① 前向：数据一层层算过去，得到预测</text><line x1="60.0" y1="76.0" x2="594.4" y2="76.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="butt"/><path d="M600.0,76.0 L592.9,79.8 L592.9,72.2 Z" fill="#1d4ed8" stroke="none"/><line x1="148.0" y1="158.0" x2="137.6" y2="158.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/><path d="M132.0,158.0 L139.1,154.2 L139.1,161.8 Z" fill="#dc2626" stroke="none"/><line x1="278.0" y1="158.0" x2="267.6" y2="158.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/><path d="M262.0,158.0 L269.1,154.2 L269.1,161.8 Z" fill="#dc2626" stroke="none"/><line x1="408.0" y1="158.0" x2="397.6" y2="158.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/><path d="M392.0,158.0 L399.1,154.2 L399.1,161.8 Z" fill="#dc2626" stroke="none"/><line x1="538.0" y1="158.0" x2="527.6" y2="158.0" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/><path d="M522.0,158.0 L529.1,154.2 L529.1,161.8 Z" fill="#dc2626" stroke="none"/><line x1="600.0" y1="200.0" x2="65.6" y2="200.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/><path d="M60.0,200.0 L67.1,196.2 L67.1,203.8 Z" fill="#dc2626" stroke="none"/><text x="330.0" y="222.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">② 反向：误差从后往前传，用链式法则算出每个权重“该往哪调、调多少”</text><rect x="150.0" y="238.0" width="380.0" height="38.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="340.0" y="261.8" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">③ 更新：w ← w − 学习率 × 梯度</text><text x="600.0" y="262.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">重复上亿次</text></svg>
