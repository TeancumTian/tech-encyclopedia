<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Noto Sans CJK SC, sans-serif"><title>工业革命：互相推动的创新链</title><rect x="20.0" y="34.0" width="180.0" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="110.0" y="58.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">纺纱机</text><text x="110.0" y="72.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">珍妮机 · 水力纺纱</text><rect x="240.0" y="34.0" width="180.0" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="330.0" y="58.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">织布成瓶颈</text><text x="330.0" y="72.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">→ 动力织布机</text><rect x="460.0" y="34.0" width="180.0" height="52.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="550.0" y="58.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">需要铁与煤</text><text x="550.0" y="72.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">焦炭炼铁 · 采矿</text><rect x="460.0" y="134.0" width="180.0" height="52.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="550.0" y="158.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">矿井要排水</text><text x="550.0" y="172.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">→ 蒸汽机</text><rect x="240.0" y="134.0" width="180.0" height="52.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="330.0" y="158.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">蒸汽驱动工厂</text><text x="330.0" y="172.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">工厂不必建在河边</text><rect x="20.0" y="134.0" width="180.0" height="52.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="110.0" y="158.2" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">铁路与轮船</text><text x="110.0" y="172.2" font-size="10.530000000000001" fill="#6b7280" text-anchor="middle" font-weight="400">运来原料 · 运走产品</text><line x1="202.0" y1="60.0" x2="232.4" y2="60.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M238.0,60.0 L230.9,63.8 L230.9,56.2 Z" fill="#111827" stroke="none"/><line x1="422.0" y1="60.0" x2="452.4" y2="60.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M458.0,60.0 L450.9,63.8 L450.9,56.2 Z" fill="#111827" stroke="none"/><line x1="550.0" y1="88.0" x2="550.0" y2="126.4" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M550.0,132.0 L546.2,124.9 L553.8,124.9 Z" fill="#111827" stroke="none"/><line x1="458.0" y1="160.0" x2="427.6" y2="160.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M422.0,160.0 L429.1,156.2 L429.1,163.8 Z" fill="#111827" stroke="none"/><line x1="238.0" y1="160.0" x2="207.6" y2="160.0" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M202.0,160.0 L209.1,156.2 L209.1,163.8 Z" fill="#111827" stroke="none"/><line x1="110.0" y1="132.0" x2="110.0" y2="93.6" stroke="#111827" stroke-width="1.5" stroke-linecap="butt"/><path d="M110.0,88.0 L113.8,95.1 L106.2,95.1 Z" fill="#111827" stroke="none"/><text x="330.0" y="112.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">一个环节变快，就逼着下一个环节创新</text><line x1="70.0" y1="340.0" x2="630.0" y2="340.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><line x1="70.0" y1="230.0" x2="70.0" y2="340.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><path d="M70.0,336.0 L234.7,335.0 L344.5,334.0 L454.3,332.0 L487.3,331.0 L520.2,328.0 L547.6,322.0 L571.3,310.0 L591.6,300.0 L608.0,270.0 L619.0,255.0 L630.0,235.0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="70.0" y1="340.0" x2="70.0" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="70.0" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1000</text><line x1="179.8" y1="340.0" x2="179.8" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="179.8" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1200</text><line x1="289.6" y1="340.0" x2="289.6" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="289.6" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1400</text><line x1="399.4" y1="340.0" x2="399.4" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="399.4" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1600</text><line x1="509.2" y1="340.0" x2="509.2" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="509.2" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1800</text><line x1="619.0" y1="340.0" x2="619.0" y2="344.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="619.0" y="356.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">2000</text><rect x="487.3" y="230.0" width="43.9" height="110.0" rx="0" fill="#fef3c7" stroke="none" stroke-width="1.2" opacity="0.7"/><path d="M70.0,336.0 L234.7,335.0 L344.5,334.0 L454.3,332.0 L487.3,331.0 L520.2,328.0 L547.6,322.0 L571.3,310.0 L591.6,300.0 L608.0,270.0 L619.0,255.0 L630.0,235.0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="509.2" y="244.0" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">工业革命</text><text x="78.0" y="242.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">世界人均产出（示意）</text><text x="289.6" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">近千年几乎是平的</text><text x="421.4" y="270.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">1800 年后才开始持续增长 →</text></svg>
