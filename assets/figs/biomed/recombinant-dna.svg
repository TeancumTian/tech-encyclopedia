<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>重组 DNA 的基本步骤</title><text x="90.0" y="26.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">① 剪：同一把“剪刀”</text><rect x="20.0" y="46.0" width="140.0" height="12.0" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><rect x="60.0" y="46.0" width="60.0" height="12.0" rx="1" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><text x="90.0" y="74.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">人的 DNA：目标基因（红）</text><text x="90.0" y="92.0" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">限制酶在 GAATTC 处切开</text><rect x="62.0" y="104.0" width="56.0" height="12.0" rx="1" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><rect x="56.0" y="104.0" width="6.0" height="6.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><rect x="118.0" y="110.0" width="6.0" height="6.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><text x="90.0" y="132.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="400">带“黏性末端”的基因片段</text><path d="M100,161 A44,44 0 1,1 80,161" stroke="#1d4ed8" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M130,223 A44,44 0 0,1 104,247" stroke="#059669" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="90.0" y="209.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">质粒</text><text x="148.0" y="255.0" font-size="10" fill="#059669" text-anchor="start" font-weight="700">抗药基因</text><text x="90.0" y="149.0" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="400">切口</text><text x="90.0" y="290.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">细菌里的环状小 DNA</text><line x1="176.0" y1="150.0" x2="208.4" y2="150.0" stroke="#111827" stroke-width="1.8" stroke-linecap="butt"/><path d="M214.0,150.0 L206.9,153.8 L206.9,146.2 Z" fill="#111827" stroke="none"/><text x="280.0" y="26.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">② 贴：连接酶缝合</text><path d="M294,106 A44,44 0 1,1 266,106" stroke="#1d4ed8" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M266,106 A44,44 0 0,1 294,106" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M320,168 A44,44 0 0,1 294,192" stroke="#059669" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="280.0" y="154.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">重组质粒</text><text x="280.0" y="226.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">基因被“缝”进质粒</text><line x1="338.0" y1="150.0" x2="370.4" y2="150.0" stroke="#111827" stroke-width="1.8" stroke-linecap="butt"/><path d="M376.0,150.0 L368.9,153.8 L368.9,146.2 Z" fill="#111827" stroke="none"/><text x="452.0" y="26.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">③ 导入细菌，抗生素筛选</text><rect x="392.0" y="70.0" width="54.0" height="28.0" rx="14.0" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="419.0" cy="84.0" r="7.0" fill="none" stroke="#dc2626" stroke-width="2"/><rect x="458.0" y="70.0" width="54.0" height="28.0" rx="14.0" fill="#fff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/><line x1="472.0" y1="76.0" x2="498.0" y2="92.0" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/><rect x="392.0" y="144.0" width="54.0" height="28.0" rx="14.0" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="419.0" cy="158.0" r="7.0" fill="none" stroke="#dc2626" stroke-width="2"/><rect x="458.0" y="144.0" width="54.0" height="28.0" rx="14.0" fill="#fff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/><line x1="472.0" y1="150.0" x2="498.0" y2="166.0" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/><text x="452.0" y="236.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">含抗生素的培养基里</text><text x="452.0" y="249.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">只有拿到质粒的细菌活下来</text><line x1="526.0" y1="150.0" x2="554.4" y2="150.0" stroke="#111827" stroke-width="1.8" stroke-linecap="butt"/><path d="M560.0,150.0 L552.9,153.8 L552.9,146.2 Z" fill="#111827" stroke="none"/><text x="620.0" y="26.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">④ 繁殖并生产</text><rect x="578.0" y="60.0" width="84.0" height="130.0" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><rect x="588.0" y="76.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="612.0" y="76.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="636.0" y="76.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="588.0" y="98.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="612.0" y="98.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="636.0" y="98.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="588.0" y="120.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="612.0" y="120.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><rect x="636.0" y="120.0" width="18.0" height="10.0" rx="5.0" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><circle cx="592.0" cy="150.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><circle cx="616.0" cy="150.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><circle cx="640.0" cy="150.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><circle cx="592.0" cy="166.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><circle cx="616.0" cy="166.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><circle cx="640.0" cy="166.0" r="4.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><text x="620.0" y="210.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">发酵罐</text><text x="620.0" y="232.0" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">目标蛋白</text><text x="620.0" y="245.7" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">（如人胰岛素）</text></svg>
