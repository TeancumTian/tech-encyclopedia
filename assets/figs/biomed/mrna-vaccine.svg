<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Noto Sans CJK SC, sans-serif"><title>mRNA 疫苗的工作流程</title><circle cx="60.0" cy="150.0" r="32.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="92.0" cy="150.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="87.7" cy="166.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="76.0" cy="177.7" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="60.0" cy="182.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="44.0" cy="177.7" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="32.3" cy="166.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="28.0" cy="150.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="32.3" cy="134.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="44.0" cy="122.3" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="60.0" cy="118.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="76.0" cy="122.3" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><circle cx="87.7" cy="134.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.2"/><path d="M42,150 q6,-10 12,0 t12,0 t12,0" stroke="#dc2626" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="60.0" y="202.0" font-size="10.5" fill="#d97706" text-anchor="middle" font-weight="700">① 脂质纳米颗粒</text><text x="60.0" y="215.7" font-size="10.5" fill="#d97706" text-anchor="middle" font-weight="700">包着 mRNA</text><path d="M130,155 A200,115 0 1,0 530,155 A200,115 0 1,0 130,155 Z" stroke="#475569" stroke-width="1.6" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/><text x="330.0" y="30.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">人体细胞（如注射部位的肌肉细胞、免疫细胞）</text><line x1="96.0" y1="150.0" x2="144.4" y2="150.0" stroke="#d97706" stroke-width="2" stroke-linecap="butt"/><path d="M150.0,150.0 L142.9,153.8 L142.9,146.2 Z" fill="#d97706" stroke="none"/><circle cx="250.0" cy="200.0" r="36.0" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="250.0" y="196.0" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">细胞核</text><text x="250.0" y="209.0" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">（DNA）</text><text x="250.0" y="252.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">mRNA 不进细胞核</text><path d="M170,120 q8,-10 16,0 t16,0 t16,0 t16,0 t16,0 t16,0" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="218.0" y="104.0" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">② mRNA＝蛋白“图纸”</text><path d="M265,122 A15,11 0 1,0 295,122 A15,11 0 1,0 265,122 Z" stroke="#7c3aed" stroke-width="1.4" fill="#ede9fe" stroke-linejoin="round" stroke-linecap="round"/><text x="282.0" y="145.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">核糖体</text><circle cx="300.0" cy="110.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><circle cx="311.0" cy="107.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><circle cx="322.0" cy="104.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><circle cx="333.0" cy="101.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><circle cx="344.0" cy="98.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><circle cx="355.0" cy="95.0" r="5.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/><text x="345.0" y="132.0" font-size="10.5" fill="#1d4ed8" text-anchor="start" font-weight="700">③ 造出病毒蛋白</text><path d="M488.0,110.0 L470.0,102.0 L470.0,118.0 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#1d4ed8" stroke-linejoin="round" stroke-linecap="round"/><path d="M508.0,150.0 L490.0,142.0 L490.0,158.0 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#1d4ed8" stroke-linejoin="round" stroke-linecap="round"/><path d="M496.0,192.0 L478.0,184.0 L478.0,200.0 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#1d4ed8" stroke-linejoin="round" stroke-linecap="round"/><text x="420.0" y="230.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">④ 展示 / 分泌出去</text><text x="330.0" y="286.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">几天后 mRNA 被分解，不改变 DNA</text><rect x="556.0" y="54.0" width="116.0" height="44.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="614.0" y="73.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">B 细胞</text><text x="614.0" y="86.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">产生抗体</text><rect x="556.0" y="108.0" width="116.0" height="44.0" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="614.0" y="127.8" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">T 细胞</text><text x="614.0" y="140.7" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">清除被感染细胞</text><rect x="556.0" y="162.0" width="116.0" height="44.0" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/><text x="614.0" y="181.8" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">记忆细胞</text><text x="614.0" y="194.7" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">下次快速反击</text><line x1="514.0" y1="150.0" x2="549.7" y2="84.3" stroke="#059669" stroke-width="1.4" stroke-linecap="butt"/><path d="M552.0,80.0 L551.9,87.0 L546.2,83.9 Z" fill="#059669" stroke="none"/><line x1="514.0" y1="150.0" x2="547.7" y2="132.3" stroke="#0f766e" stroke-width="1.4" stroke-linecap="butt"/><path d="M552.0,130.0 L548.1,135.8 L545.0,130.0 Z" fill="#0f766e" stroke="none"/><line x1="514.0" y1="150.0" x2="548.3" y2="180.7" stroke="#dc2626" stroke-width="1.4" stroke-linecap="butt"/><path d="M552.0,184.0 L545.2,182.3 L549.6,177.4 Z" fill="#dc2626" stroke="none"/><text x="614.0" y="232.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">⑤ 免疫系统</text><text x="614.0" y="245.7" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="700">学会认这个蛋白</text></svg>
