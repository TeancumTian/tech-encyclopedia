c2626" stroke-width="2.4" stroke-linecap="round"/><line x1="250.0" y1="88.0" x2="238.0" y2="104.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><line x1="238.0" y1="124.0" x2="250.0" y2="140.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><line x1="250.0" y1="124.0" x2="238.0" y2="140.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><text x="234.0" y="176.0" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">✂ 在 PAM 前约 3 个碱基处双链断裂</text><text x="520.0" y="50.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">换一段向导 RNA</text><text x="520.0" y="68.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">＝换一个目标</text><text x="520.0" y="98.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">以往：每个目标要</text><text x="520.0" y="111.7" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">重新设计一种蛋白</text><text x="520.0" y="125.3" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">CRISPR：只需合成</text><text x="520.0" y="138.9" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">一段新 RNA</text><text x="340.0" y="202.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">② 细胞修复断口：两种结果</text><rect x="30.0" y="214.0" width="300.0" height="90.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="180.0" y="243.8" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">直接粘回（常出错）</text><text x="180.0" y="257.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">多出或少掉几个碱基</text><text x="180.0" y="270.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">→ 基因读错，被“敲除”</text><text x="180.0" y="283.7" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">用于研究基因功能、关掉致病基因</text><rect x="350.0" y="214.0" width="300.0" height="90.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="500.0" y="243.8" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">照模板修复</text><text x="500.0" y="257.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">同时提供一段正确序列</text><text x="500.0" y="270.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">→ 按模板改写</text><text x="500.0" y="283.7" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">用于“修正”突变（效率较低）</text></svg>
