<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Noto Sans CJK SC, sans-serif"><title>新药研发漏斗</title><path d="M30.0,24.0 L450.0,24.0 L427.1,58.0 L52.9,58.0 Z" stroke="#1d4ed8" stroke-width="1.2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="46.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">靶点发现 · 苗头筛选</text><text x="460.0" y="46.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">上万个候选分子</text><path d="M52.9,62.0 L427.1,62.0 L404.3,96.0 L75.7,96.0 Z" stroke="#1d4ed8" stroke-width="1.2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="84.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">先导化合物优化</text><text x="437.1" y="84.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">几百个</text><path d="M75.7,100.0 L404.3,100.0 L381.4,134.0 L98.6,134.0 Z" stroke="#0f766e" stroke-width="1.2" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="122.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">临床前：细胞和动物实验</text><text x="414.3" y="122.0" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700">十几个</text><path d="M98.6,138.0 L381.4,138.0 L358.6,172.0 L121.4,172.0 Z" stroke="#059669" stroke-width="1.2" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="160.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">一期：几十名健康志愿者 · 安全吗</text><text x="391.4" y="160.0" font-size="11" fill="#059669" text-anchor="start" font-weight="700">约 10 个</text><path d="M121.4,176.0 L358.6,176.0 L335.7,210.0 L144.3,210.0 Z" stroke="#059669" stroke-width="1.2" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="198.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">二期：几百名患者 · 有效吗、多大剂量</text><path d="M144.3,214.0 L335.7,214.0 L312.9,248.0 L167.1,248.0 Z" stroke="#059669" stroke-width="1.2" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="236.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">三期：上千名患者 · 随机对照</text><path d="M167.1,252.0 L312.9,252.0 L290.0,286.0 L190.0,286.0 Z" stroke="#d97706" stroke-width="1.2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="274.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">审批上市</text><text x="322.9" y="274.0" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">1 个</text><line x1="560.0" y1="138.0" x2="560.0" y2="248.0" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/><line x1="560.0" y1="138.0" x2="554.0" y2="138.0" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/><line x1="560.0" y1="248.0" x2="554.0" y2="248.0" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/><text x="568.0" y="187.0" font-size="10.5" fill="#059669" text-anchor="start" font-weight="700">临床试验</text><text x="568.0" y="200.7" font-size="10.5" fill="#059669" text-anchor="start" font-weight="700">约九成在这里失败</text><text x="240.0" y="304.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">↓ 上市后继续监测罕见副作用（四期）</text><rect x="480.0" y="272.0" width="190.0" height="56.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="575.0" y="294.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">总计约 10–15 年</text><text x="575.0" y="316.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">花费十亿美元级别</text><text x="340.0" y="352.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">每一层都在问同一个问题：它能精准结合靶点、又不伤及其他吗？最后由统计说了算。</text></svg>
