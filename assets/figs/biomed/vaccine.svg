="#059669" text-anchor="start" font-weight="400">足以挡住感染的水平</text><line x1="84.0" y1="44.0" x2="84.0" y2="227.1" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="butt"/><path d="M84.0,232.0 L80.7,225.8 L87.3,225.8 Z" fill="#1d4ed8" stroke="none"/><text x="90.0" y="40.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">接种疫苗</text><line x1="297.0" y1="44.0" x2="297.0" y2="227.1" stroke="#dc2626" stroke-width="1.6" stroke-linecap="butt"/><path d="M297.0,232.0 L293.7,225.8 L300.3,225.8 Z" fill="#dc2626" stroke="none"/><text x="301.0" y="40.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">遇到真病原体</text><text x="163.1" y="190.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">初次应答：慢、少</text><text x="400.5" y="72.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">再次应答：快、多、持久</text><rect x="540.0" y="50.0" width="130.0" height="80.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="605.0" y="74.8" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">初次</text><text x="605.0" y="88.4" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">要 1–2 周</text><text x="605.0" y="101.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">抗体量少</text><text x="605.0" y="114.7" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">留下记忆细胞</text><rect x="540.0" y="145.0" width="130.0" height="80.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="605.0" y="170.7" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">再次</text><text x="605.0" y="183.9" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">几天内反击</text><text x="605.0" y="196.4" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">抗体多、结合更牢</text><text x="605.0" y="208.9" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">病还没发起来就被压住</text><text x="605.0" y="250.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">疫苗＝无害的“演习”</text></svg>
