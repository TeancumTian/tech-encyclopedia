<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Noto Sans CJK SC, sans-serif"><title>照相机与胶片</title><line x1="60.0" y1="150.0" x2="60.0" y2="110.0" stroke="#92400e" stroke-width="5" stroke-linecap="round"/><circle cx="60.0" cy="92.0" r="22.0" fill="#bbf7d0" stroke="#15803d" stroke-width="1.4"/><text x="60.0" y="172.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">物体</text><rect x="240.0" y="60.0" width="200.0" height="120.0" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/><text x="340.0" y="52.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">暗箱</text><path d="M240,92 Q252,120 240,148 Q228,120 240,92 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="196.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">透镜</text><line x1="60.0" y1="72.0" x2="240.0" y2="106.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/><line x1="240.0" y1="106.0" x2="434.0" y2="160.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/><line x1="60.0" y1="72.0" x2="240.0" y2="134.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/><line x1="240.0" y1="134.0" x2="434.0" y2="160.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/><line x1="60.0" y1="150.0" x2="240.0" y2="110.0" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round"/><line x1="240.0" y1="110.0" x2="434.0" y2="80.0" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round"/><line x1="60.0" y1="150.0" x2="240.0" y2="132.0" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round"/><line x1="240.0" y1="132.0" x2="434.0" y2="80.0" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round"/><rect x="434.0" y="66.0" width="8.0" height="108.0" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="452.0" y="100.0" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">胶片</text><text x="452.0" y="118.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">（倒立的像）</text><circle cx="410.0" cy="150.0" r="8.0" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/><line x1="410.0" y1="142.0" x2="410.0" y2="128.0" stroke="#92400e" stroke-width="2" stroke-linecap="round"/><rect x="530.0" y="60.0" width="140.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="600.0" y="82.0" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="700">曝光量</text><text x="600.0" y="106.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">= 光强 × 时间</text><text x="600.0" y="130.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">光圈：进光多少</text><text x="600.0" y="150.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">快门：曝光多久</text><line x1="20.0" y1="214.0" x2="660.0" y2="214.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><rect x="20.0" y="228.0" width="200.0" height="92.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="120.0" y="252.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">① 曝光</text><text x="120.0" y="278.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">卤化银晶体吸收光子</text><text x="120.0" y="298.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">析出微量银 = 潜影</text><line x1="222.0" y1="274.0" x2="235.1" y2="274.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M240.0,274.0 L233.8,277.3 L233.8,270.7 Z" fill="#111827" stroke="none"/><rect x="242.0" y="228.0" width="200.0" height="92.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="342.0" y="252.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">② 显影 · 定影</text><text x="342.0" y="278.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">潜影处整颗变成黑银粒</text><text x="342.0" y="298.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">洗掉未感光的卤化银</text><line x1="444.0" y1="274.0" x2="457.1" y2="274.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M462.0,274.0 L455.8,277.3 L455.8,270.7 Z" fill="#111827" stroke="none"/><rect x="464.0" y="228.0" width="200.0" height="92.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="564.0" y="252.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">③ 负片 → 正片</text><text x="564.0" y="278.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">亮处在负片上变黑</text><text x="564.0" y="298.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">透过负片印到相纸上</text></svg>
