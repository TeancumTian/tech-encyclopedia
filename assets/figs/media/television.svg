059669" text-anchor="middle" font-weight="700">③ 显像管：电子束重画</text><path d="M480,90 L520,90 L560,46 L660,46 L660,176 L560,176 L520,122 L480,122 Z" stroke="#111827" stroke-width="1.4" fill="#f3f4f6" stroke-linejoin="round" stroke-linecap="round"/><rect x="470.0" y="96.0" width="14.0" height="20.0" rx="2" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="477.0" y="136.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">电子枪</text><line x1="484.0" y1="106.0" x2="650.0" y2="70.0" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4,3"/><circle cx="650.0" cy="70.0" r="4.0" fill="#059669" stroke="none" stroke-width="0"/><rect x="536.0" y="96.0" width="12.0" height="20.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><line x1="540.0" y1="118.0" x2="516.0" y2="148.0" stroke="#d97706" stroke-width="1" stroke-linecap="round"/><text x="500.0" y="160.0" font-size="10.5" fill="#d97706" text-anchor="middle" font-weight="400">偏转线圈</text><text x="612.0" y="194.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">荧光屏：被击中处发光</text><rect x="20.0" y="214.0" width="640.0" height="104.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="240.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">为什么要扫描？</text><text x="200.0" y="240.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">无线电一次只能传一个数值；把二维画面变成一维信号，才能用一条信道发送。</text><text x="34.0" y="268.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">为什么看起来是连续的？</text><text x="200.0" y="268.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">每秒几十幅画面（早期 25 或 30 幅），大脑把它们连成连续的运动。</text><text x="34.0" y="296.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">关键是同步</text><text x="200.0" y="296.0" font-size="11" fill="#111827" text-anchor="start" font-weight="400">收发两端必须以同样的顺序和节奏扫描，否则画面会撕裂、滚动。</text></svg>
