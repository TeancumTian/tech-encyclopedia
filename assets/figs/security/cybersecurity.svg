<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Noto Sans CJK SC, sans-serif"><title>纵深防御：瑞士奶酪模型</title><path d="M150.0,50.0 L176.0,40.0 L176.0,220.0 L150.0,230.0 Z" stroke="#0f766e" stroke-width="1.4" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="163.0" cy="80.0" r="9.0" fill="#fff" stroke="#0f766e" stroke-width="1"/><circle cx="163.0" cy="180.0" r="9.0" fill="#fff" stroke="#0f766e" stroke-width="1"/><text x="163.0" y="252.0" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">人员培训</text><path d="M242.0,50.0 L268.0,40.0 L268.0,220.0 L242.0,230.0 Z" stroke="#1d4ed8" stroke-width="1.4" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/><circle cx="255.0" cy="130.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="1"/><circle cx="255.0" cy="180.0" r="9.0" fill="#fff" stroke="#1d4ed8" stroke-width="1"/><text x="255.0" y="252.0" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">身份认证</text><path d="M334.0,50.0 L360.0,40.0 L360.0,220.0 L334.0,230.0 Z" stroke="#7c3aed" stroke-width="1.4" fill="#ede9fe" stroke-linejoin="round" stroke-linecap="round"/><circle cx="347.0" cy="100.0" r="9.0" fill="#fff" stroke="#7c3aed" stroke-width="1"/><circle cx="347.0" cy="180.0" r="9.0" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="347.0" y="252.0" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="700">防火墙/网络分段</text><path d="M426.0,50.0 L452.0,40.0 L452.0,220.0 L426.0,230.0 Z" stroke="#059669" stroke-width="1.4" fill="#d1fae5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="439.0" cy="60.0" r="9.0" fill="#fff" stroke="#059669" stroke-width="1"/><circle cx="439.0" cy="180.0" r="9.0" fill="#fff" stroke="#059669" stroke-width="1"/><text x="439.0" y="252.0" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="700">补丁与终端防护</text><path d="M518.0,50.0 L544.0,40.0 L544.0,220.0 L518.0,230.0 Z" stroke="#d97706" stroke-width="1.4" fill="#fef