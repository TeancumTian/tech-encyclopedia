<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Noto Sans CJK SC, sans-serif"><title>公钥密码的两个直观类比</title><text x="340.0" y="26.0" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">① 挂锁：人人能锁，只有主人能开</text><rect x="74.0" y="74.0" width="32.0" height="26.0" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><path d="M80,74 L80,62 Q80,50 90,50 Q100,50 100,62 L100,58" stroke="#059669" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="90.0" y="120.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">Bob 公开发放</text><text x="90.0" y="136.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">打开的锁（公钥）</text><line x1="130.0" y1="86.0" x2="194.4" y2="86.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M200.0,86.0 L192.9,89.8 L192.9,82.2 Z" fill="#111827" stroke="none"/><rect x="210.0" y="66.0" width="60.0" height="40.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="240.0" y="91.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">信</text><rect x="274.0" y="74.0" width="32.0" height="26.0" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><path d="M280,74 L280,62 Q280,50 290,50 Q300,50 300,62 L300,74" stroke="#059669" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="260.0" y="128.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">Alice 放信、扣上锁</text><line x1="320.0" y1="86.0" x2="414.4" y2="86.0" stroke="#111827" stroke-width="1.6" stroke-linecap="butt"/><path d="M420.0,86.0 L412.9,89.8 L412.9,82.2 Z" fill="#111827" stroke="none"/><text x="370.0" y="81.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">公开传送</text><rect x="454.0" y="74.0" width="32.0" height="26.0" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><path d="M460,74 L460,62 Q460,50 470,50 Q480,50 480,62 L480,74" stroke="#059669" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560.0" cy="86.0" r="10.0" fill="#d97706" stroke="#111827" stroke-width="1.2"/><line x1="570.0" y1="86.0" x2="600.0" y2="86.0" stroke="#111827" stroke-width="3" stroke-linecap="round"/><text x="520.0" y="128.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">只有 Bob 手里的钥匙（私钥）能打开</text><line x1="20.0" y1="150.0" x2="660.0" y2="150.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><text x="340.0" y="176.0" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700">② 混颜料：迪菲—赫尔曼密钥交换</text><circle cx="60.0" cy="220.0" r="16.0" fill="#fde68a" stroke="#111827" stroke-width="1"/><text x="60.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">公共色</text><circle cx="120.0" cy="220.0" r="16.0" fill="#f87171" stroke="#111827" stroke-width="1"/><text x="120.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">A 的秘密色</text><line x1="140.0" y1="220.0" x2="169.4" y2="220.0" stroke="#111827" stroke-width="1.4" stroke-linecap="butt"/><path d="M175.0,220.0 L167.9,223.8 L167.9,216.2 Z" fill="#111827" stroke="none"/><circle cx="200.0" cy="220.0" r="16.0" fill="#fb923c" stroke="#111827" stroke-width="1"/><text x="200.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">混合后公开</text><circle cx="620.0" cy="220.0" r="16.0" fill="#fde68a" stroke="#111827" stroke-width="1"/><text x="620.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">公共色</text><circle cx="560.0" cy="220.0" r="16.0" fill="#60a5fa" stroke="#111827" stroke-width="1"/><text x="560.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">B 的秘密色</text><line x1="540.0" y1="220.0" x2="510.6" y2="220.0" stroke="#111827" stroke-width="1.4" stroke-linecap="butt"/><path d="M505.0,220.0 L512.1,216.2 L512.1,223.8 Z" fill="#111827" stroke="none"/><circle cx="480.0" cy="220.0" r="16.0" fill="#a3e635" stroke="#111827" stroke-width="1"/><text x="480.0" y="252.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="400">混合后公开</text><line x1="225.6" y1="214.0" x2="454.4" y2="214.0" stroke="#475569" stroke-width="1.4" stroke-linecap="butt"/><path d="M460.0,214.0 L452.9,217.8 L452.9,210.2 Z" fill="#475569" stroke="none"/><path d="M220.0,214.0 L227.1,210.2 L227.1,217.8 Z" fill="#475569" stroke="none"/><text x="340.0" y="206.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">交换混合色（Eve 也能看到）</text><line x1="200.0" y1="260.0" x2="294.7" y2="290.3" stroke="#111827" stroke-width="1.2" stroke-linecap="butt"/><path d="M300.0,292.0 L292.1,293.4 L294.4,286.3 Z" fill="#111827" stroke="none"/><line x1="480.0" y1="260.0" x2="385.3" y2="290.3" stroke="#111827" stroke-width="1.2" stroke-linecap="butt"/><path d="M380.0,292.0 L385.6,286.3 L387.9,293.4 Z" fill="#111827" stroke="none"/><circle cx="340.0" cy="300.0" r="18.0" fill="#a16207" stroke="#111827" stroke-width="1.2"/><text x="340.0" y="332.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">各自再加入自己的秘密色 → 得到同一种颜色（共享密钥）</text><text x="130.0" y="300.0" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">混合容易</text><text x="550.0" y="300.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">分离极难</text></svg>
