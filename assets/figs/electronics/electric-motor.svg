<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>直流电动机</title><rect x="30.0" y="80.0" width="60.0" height="120.0" rx="3" fill="#dc2626" stroke="none" stroke-width="1.2"/><text x="60.0" y="146.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">N</text><rect x="330.0" y="80.0" width="60.0" height="120.0" rx="3" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="360.0" y="146.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">S</text><line x1="95.0" y1="100.0" x2="320.8" y2="100.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="butt"/><path d="M325.0,100.0 L319.7,102.8 L319.7,97.2 Z" fill="#d1d5db" stroke="none"/><line x1="95.0" y1="126.0" x2="320.8" y2="126.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="butt"/><path d="M325.0,126.0 L319.7,128.8 L319.7,123.2 Z" fill="#d1d5db" stroke="none"/><line x1="95.0" y1="152.0" x2="320.8" y2="152.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="butt"/><path d="M325.0,152.0 L319.7,154.8 L319.7,149.2 Z" fill="#d1d5db" stroke="none"/><line x1="95.0" y1="178.0" x2="320.8" y2="178.0" stroke="#d1d5db" stroke-width="1" stroke-linecap="butt"/><path d="M325.0,178.0 L319.7,180.8 L319.7,175.2 Z" fill="#d1d5db" stroke="none"/><rect x="150.0" y="110.0" width="120.0" height="60.0" rx="2" fill="none" stroke="#d97706" stroke-width="4"/><line x1="150.0" y1="140.0" x2="150.0" y2="75.6" stroke="#059669" stroke-width="2.6" stroke-linecap="butt"/><path d="M150.0,70.0 L153.8,77.1 L146.2,77.1 Z" fill="#059669" stroke="none"/><text x="140.0" y="66.0" font-size="11.5" fill="#059669" text-anchor="end" font-weight="700">受力↑</text><line x1="270.0" y1="140.0" x2="270.0" y2="204.4" stroke="#059669" stroke-width="2.6" stroke-linecap="butt"/><path d="M270.0,210.0 L266.2,202.9 L273.8,202.9 Z" fill="#059669" stroke="none"/><text x="280.0" y="222.0" font-size="11.5" fill="#059669" text-anchor="start" font-weight="700">受力↓</text><path d="M300.0,60.0 Q330.0,30.0 360.0,60.0" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M360.0,60.0 L352.3,57.7 L357.7,52.3 Z" fill="#7c3aed" stroke="none"/><text x="372.0" y="46.0" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">线圈转起来</text><path d="M195,235 A15,15 0 0 1 210,220 L210,235 Z" stroke="none" stroke-width="1.4" fill="#475569" stroke-linejoin="round" stroke-linecap="round"/><path d="M225,235 A15,15 0 0 0 210,220 L210,235 Z" stroke="none" stroke-width="1.4" fill="#9ca3af" stroke-linejoin="round" stroke-linecap="round"/><line x1="210.0" y1="170.0" x2="210.0" y2="220.0" stroke="#d97706" stroke-width="2" stroke-linecap="round"/><text x="232.0" y="234.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">换向器：每半圈翻转电流</text><rect x="30.0" y="250.0" width="120.0" height="36.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="90.0" y="272.3" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">电池 / 电源</text><line x1="150.0" y1="268.0" x2="195.0" y2="240.0" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><rect x="430.0" y="60.0" width="230.0" height="170.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.2"/><text x="545.0" y="86.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">电流在磁场中受力</text><text x="545.0" y="101.6" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">F = B · I · L</text><text x="545.0" y="117.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">（洛伦兹力）</text><text x="545.0" y="132.8" font-size="12" fill="#111827" text-anchor="middle" font-weight="400"></text><text x="545.0" y="148.4" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">线圈两边电流方向相反</text><text x="545.0" y="164.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">→ 一边向上、一边向下</text><text x="545.0" y="179.6" font-size="12" fill="#111827" text-anchor="middle" font-weight="400">→ 形成转矩</text><text x="545.0" y="260.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">发电机反过来用就是电动机</text></svg>
