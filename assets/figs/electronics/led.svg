<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>LED 发光</title><text x="170.0" y="26.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">电子落下，放出光子</text><rect x="40.0" y="50.0" width="260.0" height="50.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="70.0" y="80.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">导带</text><rect x="40.0" y="170.0" width="260.0" height="50.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="70.0" y="200.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">价带</text><circle cx="180.0" cy="90.0" r="7.0" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="180.0" y="94.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">−</text><circle cx="180.0" cy="180.0" r="7.0" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="180.0" y="184.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">+</text><line x1="180.0" y1="100.0" x2="180.0" y2="164.4" stroke="#111827" stroke-width="2" stroke-linecap="butt"/><path d="M180.0,170.0 L176.2,162.9 L183.8,162.9 Z" fill="#111827" stroke="none"/><text x="140.0" y="140.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">禁带 Eg</text><path d="M195,135 l10,-8 l6,10 l10,-8 l6,10 l10,-8 l6,10 l12,-6" stroke="#d97706" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="270.0" y="130.0" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">光子</text><text x="170.0" y="248.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">光子能量 = 禁带宽度：禁带越宽，颜色越偏蓝</text><rect x="360.0" y="140.0" width="46.0" height="60.0" rx="3" fill="#7f1d1d" stroke="none" stroke-width="1.2"/><text x="383.0" y="218.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">红外</text><text x="383.0" y="134.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1.2 eV</text><rect x="430.0" y="105.0" width="46.0" height="95.0" rx="3" fill="#ef4444" stroke="none" stroke-width="1.2"/><text x="453.0" y="218.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">红</text><text x="453.0" y="99.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">1.9 eV</text><rect x="500.0" y="85.0" width="46.0" height="115.0" rx="3" fill="#22c55e" stroke="none" stroke-width="1.2"/><text x="523.0" y="218.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">绿</text><text x="523.0" y="79.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">2.3 eV</text><rect x="570.0" y="65.0" width="46.0" height="135.0" rx="3" fill="#3b82f6" stroke="none" stroke-width="1.2"/><text x="593.0" y="218.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">蓝</text><text x="593.0" y="59.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">2.7 eV</text><text x="500.0" y="26.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">常见 LED 的禁带宽度</text><text x="500.0" y="246.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">蓝光 LED（氮化镓，1990 年代）+ 黄色荧光粉 = 白光</text><text x="340.0" y="284.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">LED 直接把电变成光，几乎不发热：发光效率约为白炽灯的 8–10 倍</text></svg>
