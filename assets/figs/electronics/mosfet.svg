<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Noto Sans CJK SC, sans-serif"><title>MOSFET</title><rect x="80.0" y="120.0" width="520.0" height="140.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="340.0" y="245.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">P 型硅衬底</text><rect x="110.0" y="120.0" width="140.0" height="50.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="180.0" y="150.0" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">N⁺ 源极</text><rect x="430.0" y="120.0" width="140.0" height="50.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="500.0" y="150.0" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">N⁺ 漏极</text><rect x="250.0" y="108.0" width="180.0" height="12.0" rx="0" fill="#fef9c3" stroke="#d97706" stroke-width="1.2"/><text x="440.0" y="112.0" font-size="10" fill="#d97706" text-anchor="start" font-weight="400">绝缘层（二氧化硅等）</text><rect x="250.0" y="70.0" width="180.0" height="38.0" rx="0" fill="#475569" stroke="none" stroke-width="1.2"/><text x="340.0" y="94.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">栅极 G（+）</text><rect x="250.0" y="121.0" width="180.0" height="12.0" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1.2" opacity="0.8"/><circle cx="262.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="284.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="306.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="328.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="350.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="372.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="394.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><circle cx="416.0" cy="127.0" r="2.6" fill="#fff" stroke="none" stroke-width="1.2"/><text x="340.0" y="188.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">电场吸出电子 → 形成导电沟道</text><line x1="200.0" y1="205.0" x2="474.4" y2="205.0" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="butt"/><path d="M480.0,205.0 L472.9,208.8 L472.9,201.2 Z" fill="#1d4ed8" stroke="none"/><text x="340.0" y="223.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="400">电子从源极流向漏极</text><line x1="150.0" y1="120.0" x2="150.0" y2="50.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/><text x="150.0" y="42.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">源极 S</text><line x1="548.0" y1="120.0" x2="548.0" y2="50.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/><text x="548.0" y="42.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="700">漏极 D</text><line x1="340.0" y1="70.0" x2="340.0" y2="40.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/><text x="340.0" y="286.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="400">栅极不加电压：没有沟道，关；加正电压：沟道出现，开。栅极几乎不耗电流。</text></svg>
