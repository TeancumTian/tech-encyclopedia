dth="1.4" opacity="0.9"/><text x="430.0" y="212.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">栅极包住四面</text><rect x="20.0" y="222.0" width="12.0" height="12.0" rx="0" fill="#475569" stroke="none" stroke-width="1.2"/><text x="38.0" y="232.0" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400">栅极</text><rect x="90.0" y="222.0" width="12.0" height="12.0" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1.2" opacity="0.7"/><text x="108.0" y="232.0" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400">沟道</text><text x="330.0" y="240.0" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">包得越严，漏电越少，晶体管能做得越小</text></svg>
